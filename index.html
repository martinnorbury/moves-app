/* ==========================================================================
   BOUNDARIES TAB
   ========================================================================== */
const TIER_LABELS = {
  favorites: 'Perfect Match',
  strong_interest: 'Good Match',
  worth_trying: 'Getting Warmer',
  if_both_up_for_it: 'Worth A Try'
};
const TIER_ORDER = ['favorites', 'strong_interest', 'worth_trying', 'if_both_up_for_it'];

const ACCESS_LABELS = {
  pending: 'Waiting on both of you to answer',
  off_table: 'Not on the table',
  ...TIER_LABELS
};
const ACCESS_CLASSES = {
  pending: '',
  off_table: 'intensity-wild',
  favorites: 'access-full',
  strong_interest: 'intensity-bold',
  worth_trying: 'intensity-tease',
  if_both_up_for_it: 'intensity-risque'
};

function renderOverallStanding() {
  if (!state.headingAccess.length) return '';
  const counts = {};
  state.headingAccess.forEach(h => { counts[h.access] = (counts[h.access] || 0) + 1; });
  const order = ['favorites', 'strong_interest', 'worth_trying', 'if_both_up_for_it', 'off_table', 'pending'];
  const parts = order.filter(a => counts[a]).map(a => `${counts[a]} ${esc(ACCESS_LABELS[a])}`);
  return `
    <div class="status-strip" style="margin-bottom:18px">
      <div class="status-label">Overall, across all ${state.headingAccess.length} temptations</div>
      <div class="status-value">${parts.join(' · ')}</div>
    </div>
  `;
}

function renderHeadingAccessList() {
  if (!state.headingAccess.length) return `<div class="empty-state">Answer the 6 general questions to see this.</div>`;
  return state.headingAccess.map(h => {
    const expanded = state.expandedHeadings.has(h.category);
    return `
    <div class="boundary-row" data-toggle-heading="${esc(h.category)}" style="cursor:pointer">
      <div class="cat">${esc(h.category)}<div class="hint-text">${h.answered_count} question${h.answered_count===1?'':'s'} counted</div></div>
      <span class="pill ${ACCESS_CLASSES[h.access]}">${esc(ACCESS_LABELS[h.access])}</span>
      <span class="hint-text" style="margin-left:8px">${expanded ? '▲' : '▼'}</span>
    </div>
    ${expanded ? renderHeadingExpansion(h.category) : ''}
  `;
  }).join('');
}

function renderScoredCardRow(c, showCategory) {
  return `
    <div class="boundary-row">
      <div class="cat" style="font-size:13.5px">${esc(c.title)}${showCategory ? ` <span class="hint-text">— ${esc(c.category)}</span>` : ''}</div>
      <span class="pill ${ACCESS_CLASSES[c.tier]}">${esc(TIER_LABELS[c.tier])}</span>
    </div>
  `;
}

function renderHeadingExpansion(category) {
  const items = state.cardReport.filter(c => c.category === category);
  const offTableCount = items.filter(c => c.tier === 'off_table').length;
  const shown = items.filter(c => c.tier !== 'off_table')
    .sort((a, b) => TIER_ORDER.indexOf(a.tier) - TIER_ORDER.indexOf(b.tier));

  if (!items.length) {
    return `<div class="empty-state" style="padding:10px 0">Nothing answered by both of you in this temptation yet.</div>`;
  }

  const CAP = 6;
  const showAll = state.expandedCardLists.has(category);
  const toDisplay = showAll ? shown : shown.slice(0, CAP);
  const remaining = shown.length - toDisplay.length;

  return `
    <div style="padding:4px 0 10px 0">
      ${toDisplay.map(c => renderScoredCardRow(c, false)).join('')}
      ${remaining > 0 ? `<button class="link-btn" data-show-all-cards="${esc(category)}" style="margin-top:6px">Show all ${shown.length} →</button>` : ''}
      ${showAll && shown.length > CAP ? `<button class="link-btn" data-show-all-cards="${esc(category)}" style="margin-top:6px">Show fewer</button>` : ''}
      ${offTableCount ? `<p class="hint-text" style="margin-top:8px">${offTableCount} other question${offTableCount===1?'':'s'} answered here ${offTableCount===1?"isn't":"aren't"} on the table — not listed, since who said no isn't shown either.</p>` : ''}
    </div>
  `;
}

function renderAllAnswers() {
  const answered = getOrderedQuestions().filter(q => state.answers[q.id]);
  const filterText = state.allAnswersFilter.trim().toLowerCase();
  const searching = !!filterText;
  const filtered = searching
    ? answered.filter(q => q.title.toLowerCase().includes(filterText) || q.category.toLowerCase().includes(filterText))
    : answered;

  function renderQuestionRow(q) {
    return `
      <div style="margin-bottom:14px">
        <div class="cat" style="margin-bottom:4px; font-size:13.5px">${esc(q.title)}${q.is_general ? ' <span class="pill" style="margin-left:6px">General</span>' : ''}</div>
        ${renderAnswerControl(q, state.answers[q.id], (a) => `data-answer-q="${q.id}" data-answer-v="${a}"`)}
      </div>
    `;
  }

  let body;
  if (searching) {
    let lastCategory = null;
    body = filtered.length ? filtered.map(q => {
      const headerHtml = q.category !== lastCategory ? `<div class="hint-text" style="margin:16px 0 6px; font-weight:600; color:var(--text)">${esc(q.category)}</div>` : '';
      lastCategory = q.category;
      return headerHtml + renderQuestionRow(q);
    }).join('') : `<div class="empty-state">No answers match "${esc(state.allAnswersFilter)}".</div>`;
  } else {
    const categories = [...new Set(answered.map(q => q.category))];
    body = categories.length ? categories.map(cat => {
      const inCat = answered.filter(q => q.category === cat);
      const expanded = state.expandedAnswerCategories.has(cat);
      return `
        <div class="boundary-row" data-toggle-answer-category="${esc(cat)}" style="cursor:pointer">
          <div class="cat">${esc(cat)}<div class="hint-text">${inCat.length} answered</div></div>
          <span class="hint-text" style="margin-left:8px">${expanded ? '▲' : '▼'}</span>
        </div>
        ${expanded ? `<div style="padding:10px 0 4px">${inCat.map(renderQuestionRow).join('')}</div>` : ''}
      `;
    }).join('') : `<div class="empty-state">Nothing answered yet.</div>`;
  }

  return `
    <button class="link-btn" id="btn-close-all-answers">‹ Back to your report</button>
    <div class="section-head" style="margin-top:14px"><h2>All your answers (${answered.length})</h2></div>
    <p class="hint-text" style="margin-bottom:14px">Every question you've personally answered, across every temptation. Change any of them right here.</p>
    <div class="field" style="margin-bottom:14px"><input type="text" id="all-answers-search" placeholder="Search by title or temptation…" value="${esc(state.allAnswersFilter)}"></div>
    ${body}
  `;
}

function renderBoundariesTab(unanswered) {
  if (state.viewingAllAnswers) return renderAllAnswers();

  const generalQuestions = getWizardQuestions();
  const partnerName = state.partner ? state.partner.display_name : 'your partner';
  const pendingCount = state.pendingComparisonCards.length;

  return `
    ${pendingCount ? `
      <div class="category-row" id="btn-open-pending-comparison" style="cursor:pointer; border:1.5px solid var(--gold); margin-bottom:18px">
        <div>
          <div class="cat-name">New from ${esc(partnerName)}</div>
          <div class="cat-count">${pendingCount} question${pendingCount===1?'':'s'} waiting for your take — tap to weigh in</div>
        </div>
        <div class="cat-arrow">›</div>
      </div>
    ` : ''}
    <div class="section-head" style="margin-top:0"><h2>Your answers</h2></div>
    <p class="hint-text" style="margin-bottom:14px">Change any of these any time — you don't need to wait for ${esc(partnerName)}, and changing yours never shows ${esc(partnerName)} which way you moved it, only the mutual result below.</p>
    ${generalQuestions.map(q => {
      const mutualSpecifics = state.cardReport.filter(c => c.category === q.category && c.title !== q.title).length;
      const locked = mutualSpecifics >= 3;
      return `
      <div style="margin-bottom:18px">
        <div class="cat" style="margin-bottom:4px">${esc(q.category)}</div>
        ${locked ? `<p class="hint-text" style="margin-bottom:8px">You've both answered ${mutualSpecifics} specific questions here now, so this general one no longer affects the score — it's just your own record. Changing it won't move anything below.</p>` : ''}
        ${renderAnswerControl(q, state.answers[q.id], (a) => `data-answer-q="${q.id}" data-answer-v="${a}"`)}
      </div>
    `;
    }).join('')}

    <div class="divider"></div>
    <div class="section-head"><h2>Temptation access</h2></div>
    <p class="hint-text" style="margin-bottom:14px">A running average across every question you've both answered in that temptation — the general one plus any specific cards. Each card keeps its own score regardless; this is just the temptation-level picture. The more you've both answered, the less any single new answer shifts it — except a genuine Not For Me answer, which always closes the whole temptation, average or not.</p>
    ${renderOverallStanding()}
    ${renderHeadingAccessList()}

    <div class="divider"></div>
    <button class="btn btn-ghost" id="btn-review-answers" style="width:100%; margin-bottom:8px">Review & edit all your answers →</button>

  `;

const NARRATIVE_FIELDS = [
  { group: 'Invite email', key: 'invite_email_para1', label: 'Opening line', multiline: true },

  { group: 'Step 1 complete', key: 'step1_section3_title', label: '"While we\'re here" section — title' },

  { group: 'Step 1 complete', key: 'step1_wishlist_cta', label: 'Wishlist button text' },
  { group: 'Step 1 complete', key: 'step1_continue_cta', label: 'Continue button text' },
];
// Narrative editor is a two-level picker rather than one long scroll of
// every field on every screen: tap "Edit narrative" to see a list of pages
// (one row per screen, with a live word count), tap a page to see only
// that page's fields, edit, save, and land back on the page list — never
// scrolling past copy for screens you're not touching.
function renderNarrativeEditorSection() {
  const open = state.narrativeEditorOpen;
  const group = state.narrativeEditorGroup;
  const groups = [...new Set(NARRATIVE_FIELDS.map(f => f.group))];
  if (!open) {
    return `
      <div>
        <div class="category-row" id="btn-toggle-narrative-editor" style="cursor:pointer">
          <div>
            <div class="cat-name">Edit narrative</div>
            <div class="cat-count">Every fixed screen of copy, from the invite through to Step 1 complete — change any of it here, no code needed</div>
          </div>
          <div class="cat-arrow">›</div>
        </div>
      </div>
    `;
  }
  if (!group) {
    // Page list — one row per screen, so finding the right copy is a single tap.
    return `
      <div>
        <div class="category-row" id="btn-toggle-narrative-editor" style="cursor:pointer">
          <div>
            <div class="cat-name">Edit narrative</div>
            <div class="cat-count">Pick a page to edit its wording</div>
          </div>
          <div class="cat-arrow">⌄</div>
        </div>
        <div style="margin-top:10px">
          ${groups.map(g => {
            const fields = NARRATIVE_FIELDS.filter(f => f.group === g);
            const wordCount = fields.reduce((sum, f) => sum + nc(f.key).split(/\s+/).filter(Boolean).length, 0);
            return `
              <div class="category-row" data-narrative-group="${esc(g)}" style="cursor:pointer">
                <div>
                  <div class="cat-name">${esc(g)}</div>
                  <div class="cat-count">${fields.length} field${fields.length === 1 ? '' : 's'} · ~${wordCount} words</div>
                </div>
                <div class="cat-arrow">›</div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }
  // A single page's fields.
  const fields = NARRATIVE_FIELDS.filter(f => f.group === group);
  return `
    <div>
      <div class="category-row" id="btn-narrative-back" style="cursor:pointer">
        <div>
          <div class="cat-name">‹ ${esc(group)}</div>
          <div class="cat-count">Back to the page list</div>
        </div>
      </div>
      <div style="margin-top:14px">
        ${fields.map(f => `
          <div class="field" style="margin-bottom:10px">
            <label>${esc(f.label)}</label>
            ${f.multiline
              ? `<textarea id="narrative-${f.key}" rows="3" style="width:100%; font-family:inherit; font-size:14px; padding:10px; border-radius:var(--radius-s); border:1px solid var(--line); background:var(--surface); color:var(--text)">${esc(nc(f.key))}</textarea>`
              : `<input type="text" id="narrative-${f.key}" value="${esc(nc(f.key))}">`}
          </div>
        `).join('')}
        <button type="button" class="btn btn-primary" id="btn-save-narrative" style="width:100%">Save this page</button>
        <div id="narrative-save-error" class="error-text" style="margin-top:8px"></div>
      </div>
    </div>
  `;
}
function attachNarrativeEditorHandlers() {
  const toggleBtn = document.getElementById('btn-toggle-narrative-editor');
  if (toggleBtn) toggleBtn.onclick = () => {
    state.narrativeEditorOpen = !state.narrativeEditorOpen;
    state.narrativeEditorGroup = null;
    render();
  };
  $app.querySelectorAll('[data-narrative-group]').forEach(el => el.onclick = () => {
    state.narrativeEditorGroup = el.dataset.narrativeGroup;
    render();
  });
  const backBtn = document.getElementById('btn-narrative-back');
  if (backBtn) backBtn.onclick = () => { state.narrativeEditorGroup = null; render(); };
  const saveBtn = document.getElementById('btn-save-narrative');
  if (saveBtn) saveBtn.onclick = async () => {
    const errEl = document.getElementById('narrative-save-error');
    const fields = NARRATIVE_FIELDS.filter(f => f.group === state.narrativeEditorGroup);
    saveBtn.disabled = true;
    for (const f of fields) {
      const el = document.getElementById(`narrative-${f.key}`);
      if (!el) continue;
      const value = el.value;
      if (value === nc(f.key)) continue; // unchanged — skip the round trip
      const { error } = await sb.rpc('set_narrative_content', { p_key: f.key, p_value: value });
      if (error) { errEl.textContent = error.message; saveBtn.disabled = false; return; }
      state.narrativeContent[f.key] = value;
    }
    saveBtn.disabled = false;
    showToast('Narrative updated.');
    // Stay on this page rather than bouncing back to the page list —
    // editing several fields on one screen is one tap into it, not one
    // tap per field, and the "back to page list" row is right there
    // whenever you're actually done with this page. (render() already
    // re-attaches this and every other handler via attachMainHandlers().)
    render();
  };
}

function renderForfeitsSection() {

    const groups = [
      ...(nonIntimate.length ? [['Non-intimate', nonIntimate]] : []),

    ${body}
    ${state.forfeitLibrary.length ? `<button class="link-btn" id="btn-delete-all-forfeits" style="margin-top:14px; color:var(--wine-bright)">Delete all ${state.forfeitLibrary.length} forfeits</button>` : ''}
  `;
}

function renderQuestionsColumn() {
  const countByCategory = {};
  state.questions.forEach(q => { countByCategory[q.category] = (countByCategory[q.category] || 0) + 1; });
  const answeredByCategory = {};
  state.questions.forEach(q => {

  });

  const searchText = state.questionsSearch.trim().toLowerCase();
  const searchResults = searchText ? state.questions.filter(q =>
    q.title.toLowerCase().includes(searchText) || INTENSITY_LABELS[q.max_intensity].toLowerCase().includes(searchText) || q.max_intensity.includes(searchText)

function renderDeckView() {
  const cards = state.questions.filter(q => q.category === state.openCategory);

  const modeToggle = `
    <div class="btn-row" style="margin:14px 0">
      <button class="btn ${state.deckViewMode==='card'?'btn-primary':'btn-ghost'} btn-small" data-deck-mode="card">One at a time</button>
      <button class="btn ${state.deckViewMode==='list'?'btn-primary':'btn-ghost'} btn-small" data-deck-mode="list">List view</button>
    </div>
  `;

  if (cards.length === 0) {
    return `
      <button class="link-btn" data-close-deck="1">‹ Back to temptations</button>
      <div class="auth-hero" style="margin-top:20px"><h1>${esc(state.openCategory)}</h1><p>No cards here yet.</p></div>
      <button class="btn btn-gold" id="btn-add-card">Add the first card</button>
    `;
  }

  if (state.deckViewMode === 'list') return renderDeckListView(cards, modeToggle);
  return renderDeckCardView(cards, modeToggle);
}

function renderDeckListView(cards, modeToggle) {
  const filterText = state.deckFilter.trim().toLowerCase();
  const filtered = filterText ? cards.filter(q => q.title.toLowerCase().includes(filterText)) : cards;

  return `
    <button class="link-btn" data-close-deck="1">‹ Back to temptations</button>
    ${modeToggle}
    <div class="field" style="margin-bottom:14px"><input type="text" id="deck-search" placeholder="Search ${esc(state.openCategory)}…" value="${esc(state.deckFilter)}"></div>
    ${filtered.length ? filtered.map((q, i) => {
      const realIdx = cards.indexOf(q);
      const answer = state.answers[q.id];
      return `
        <div class="category-row" data-open-card="${realIdx}" style="cursor:pointer">
          <div>
            <div class="cat-name" style="font-size:14.5px">${esc(q.title)}</div>
            <div class="cat-count">
              <span class="pill intensity-${q.max_intensity}" style="margin-right:6px">${INTENSITY_LABELS[q.max_intensity]}</span>
              ${answer ? esc(ANSWER_LABELS[answer]) : 'Not answered yet'}
            </div>
          </div>
          <div class="cat-arrow">›</div>
        </div>
      `;
    }).join('') : `<div class="empty-state">No cards match "${esc(state.deckFilter)}".</div>`}
    <button class="link-btn" data-delete-all-heading="${esc(state.openCategory)}" style="margin-top:14px; color:var(--wine-bright)">Delete all ${cards.length} cards in "${esc(state.openCategory)}"</button>
  `;
}

function renderDeckCardView(cards, modeToggle) {
  const idx = Math.min(state.deckIndex, Math.max(0, cards.length - 1));
  const q = cards[idx];

  if (q.image_path && !state.imageUrls[q.image_path]) {
    fetchSignedImageUrl(q.image_path);
  }
  const imgUrl = q.image_path ? state.imageUrls[q.image_path] : null;

  return `
    <button class="link-btn" data-close-deck="1">‹ Back to temptations</button>
    ${modeToggle}
    <div class="deck-progress">${esc(state.openCategory)} — card ${idx + 1} of ${cards.length}</div>
    <div class="deck-card">
      ${imgUrl ? `<img src="${esc(imgUrl)}" alt="">` : ''}
      <div class="deck-card-body">
        <div class="deck-card-title">${esc(q.title)}${q.is_general ? ' <span class="pill" style="margin-left:6px">General</span>' : ''}</div>
        ${q.explanation ? `<div class="deck-card-explain">${esc(q.explanation)}</div>` : ''}
        ${renderAnswerControl(q, state.answers[q.id], (a) => `data-answer-q="${q.id}" data-answer-v="${a}"`)}
        <div class="btn-row" style="margin-top:10px">
          <button class="link-btn" data-edit-card="${q.id}">Edit card</button>
          <button class="link-btn" data-attach-image="${q.id}">${imgUrl ? 'Replace image' : 'Attach an image'}</button>
          <button class="link-btn" data-delete-card="${q.id}" style="color:var(--wine-bright)">Delete this card</button>
        </div>
      </div>
    </div>
    <div class="deck-nav">
      <button data-deck-prev="1" ${idx===0?'disabled':''}>‹ Previous</button>
      <button id="btn-add-card">+ Add a card here</button>
      <button data-deck-next="1" ${idx===cards.length-1?'disabled':''}>Next ›</button>
    </div>
    <button class="link-btn" data-delete-all-heading="${esc(state.openCategory)}" style="margin-top:14px; color:var(--wine-bright)">Delete all ${cards.length} cards in "${esc(state.openCategory)}"</button>

  `;
}

async function fetchSignedImageUrl(path, bucket = 'boundary-images') {
  if (state.imageUrls[path] === 'pending') return;
  state.imageUrls[path] = 'pending';
  const { data } = await sb.storage.from(bucket).createSignedUrl(path, 3600);
  if (data && data.signedUrl) {
    state.imageUrls[path] = data.signedUrl;
    render();
  }
}


/* ==========================================================================
   REWARDS TAB
   ========================================================================== */
function renderRewardsTab() {
  return `
    <p class="hint-text" style="margin-bottom:14px">Unlocked automatically as the Heat Meter rises. Since these are shared — you'll both experience whatever it is — either of you can add, edit, or claim one.</p>
    <button class="btn btn-ghost" id="btn-add-reward" style="margin-bottom:16px">Add a reward</button>
    ${state.rewards.length ? state.rewards.map(r => {
      const revealed = r.heat_threshold === null || state.heat >= r.heat_threshold;
      return `
      <div class="dare ${revealed ? 'unlocked' : 'locked'}" data-edit-reward="${r.id}" style="cursor:pointer">
        <div class="dare-top">
          <div class="dare-title">${revealed ? esc(r.title) : 'Locked reward'}</div>
          ${r.completed ? `<span class="pill">claimed</span>` : ''}
        </div>
        <div class="dare-body">${revealed ? esc(r.details) : (r.teaser ? esc(r.teaser) : 'Keep playing to reveal this.')}</div>
        <div class="hint-text">${esc(r.unlock_condition)}</div>
        ${(!r.completed && revealed) ? `<div class="btn-row" style="margin-top:10px"><button class="btn btn-ghost btn-small" data-reward-complete="${r.id}">Mark claimed</button></div>` : ''}

/* ==========================================================================
   HISTORY TAB
   ========================================================================== */
function renderHistoryTab() {
  const done = state.dares.filter(d => !['sent'].includes(d.status));
  return `
    <div class="section-head" style="margin-top:0"><h2>Weekly results</h2></div>
    ${renderSettlementHistory()}
    <div class="divider"></div>
    <div class="section-head"><h2>All activity</h2></div>
    ${done.length ? done.map(d => renderDareCard(d, false, true)).join('') : `<div class="empty-state">Nothing yet.</div>`}
  `;
}

function renderSettlementHistory() {
  const settled = state.settlementHistory.filter(s => s.winner_id); // exclude ties, nothing to show for those
  if (!settled.length) return `<div class="empty-state" style="margin-bottom:14px">No weeks settled yet.</div>`;
  return settled.map(s => {
    const winnerName = s.winner_id === state.session.user.id ? 'You' : (state.partner ? state.partner.display_name : 'They');
    const loserName = s.loser_id === state.session.user.id ? 'You' : (state.partner ? state.partner.display_name : 'They');
    const weekLabel = new Date(s.week_start).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' – ' +
                       new Date(s.week_end).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    let forfeitLine;
    if (!s.forfeit_title) forfeitLine = `${loserName} hasn't picked a forfeit yet.`;
    else if (!s.forfeit_completed_at) forfeitLine = `Forfeit: ${esc(s.forfeit_title)} — not yet done.`;
    else forfeitLine = `Forfeit: ${esc(s.forfeit_title)} — done.`;
    const evidenceCount = state.forfeitEvidence.filter(e => e.settlement_id === s.id).length;
    return `
      <div class="category-row" style="cursor:default">
        <div>
          <div class="cat-name" style="font-size:14.5px">${weekLabel} — ${esc(winnerName)} won (${s.winner_points} to ${s.loser_points})</div>
          <div class="cat-count">${forfeitLine}</div>
          ${evidenceCount ? `<button class="link-btn" data-view-forfeit-evidence="${s.id}" style="margin-top:4px">View evidence (${evidenceCount})</button>` : ''}
        </div>
      </div>
    `;
  }).join('');
}
/* ==========================================================================
   TAB BAR
   ========================================================================== */
function renderTabbar() {
  const pending = state.dares.filter(d => d.recipient_id === state.session.user.id && d.status === 'sent').length;
  const pendingComparisons = state.pendingComparisonCards.length;
  const pendingRewards = state.rewards.filter(r => !r.completed && (r.heat_threshold === null || state.heat >= r.heat_threshold)).length;
  const isAdmin = state.profile && state.profile.is_admin;
  const tabs = [
    ['home','Playroom'], ['boundaries','Kinks'], ['dares','Dares'], ['rewards','Rewards'], ['history','History']
  ];
  if (isAdmin) tabs.push(['admin','Admin']);
  return `<div class="tabbar">
    ${tabs.map(([id,label]) => `
      <button class="tab ${state.tab===id?'active':''}" data-tab="${id}" style="position:relative">
        ${label}${(id==='dares' && pending) || (id==='boundaries' && pendingComparisons) || (id==='rewards' && pendingRewards) ? '<span class="dot"></span>' : ''}
      </button>
    `).join('')}
  </div>`;
}

/* ==========================================================================
   MODALS: create dare / create reward / counter
   ========================================================================== */
const TIER_MAX_INTENSITY = { favorites: 'wild', strong_interest: 'bold', worth_trying: 'risque', if_both_up_for_it: 'tease' };

function openCreateDareModal() {
  const eligible = state.headingAccess.filter(h => h.access !== 'off_table' && h.access !== 'pending');
  state.modal = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal-sheet">
        <h2>Create a dare</h2>
        ${eligible.length === 0 ? `<p class="hint-text">No temptations are open for a dare yet — answer more questions together first.</p>` : `
        <div class="field"><label>Temptation</label>
          <select id="d-category">
            ${eligible.map(h => `<option value="${esc(h.category)}" data-max="${TIER_MAX_INTENSITY[h.access]}">${esc(h.category)} — ${esc(ACCESS_LABELS[h.access])}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Intensity</label>
          <select id="d-blind-intensity"></select>
        </div>
        <div class="field" style="margin-bottom:14px"><label>Deadline (optional)</label><input type="datetime-local" id="d-blind-deadline"></div>
        <button type="button" class="btn btn-gold" id="btn-blind-send" style="width:100%; margin-bottom:10px">🙈 Blind draw — send it</button>
        <p class="hint-text" style="margin-bottom:14px">Every dare is drawn blind — nobody sees which one it is except whoever's doing it, not even you. If it's not quite right, ${esc(state.partner ? state.partner.display_name : 'they')} can always counter it once they see it.</p>

        <button type="button" class="btn btn-ghost" id="btn-wishlist-send" style="width:100%; margin-bottom:10px; display:none">🎁 Draw from ${esc(state.partner ? state.partner.display_name : 'their')}'s wishlist</button>
        <p class="hint-text" id="wishlist-send-hint" style="margin-bottom:20px; display:none">${esc(state.partner ? state.partner.display_name : 'They')} added things to this temptation's wishlist themselves — this draws one blind, so it's something ${esc(state.partner ? state.partner.display_name : 'they')} genuinely wished for, not a guess.</p>

        <div class="divider" style="margin-bottom:16px"></div>
        <button type="button" class="btn btn-ghost" id="btn-write-own" style="margin-bottom:14px">Write my own instead</button>
        <form id="dare-form" class="stack" style="display:none">
          <div class="field"><label>Title</label><input type="text" id="d-title" required></div>
          <div class="field"><label>Teaser (shown before ${esc(state.partner ? state.partner.display_name : 'they')} reveal it)</label><input type="text" id="d-teaser"></div>
          <div class="field"><label>Full instructions</label><textarea id="d-instructions" required></textarea></div>
          <div class="field"><label>Intensity</label>
            <select id="d-intensity"></select>
          </div>
          <div class="field"><label>Deadline (optional)</label><input type="datetime-local" id="d-deadline"></div>
          <div class="field"><label>Image (optional)</label>
            <div id="d-image-preview"></div>
            <input type="file" id="d-image" accept="image/*">
          </div>
          <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-dim)">
            <input type="checkbox" id="d-confirm" style="width:auto"> Requires my confirmation to count as complete
          </label>
          <div id="dare-form-error" class="error-text"></div>
          <div class="btn-row">
            <button type="button" class="btn btn-ghost" id="modal-cancel">Cancel</button>
            <button type="submit" class="btn btn-primary">Send</button>
          </div>
        </form>`}
        ${eligible.length === 0 ? `<button class="btn btn-ghost" id="modal-cancel" style="margin-top:16px">Close</button>` : ''}
      </div>
    </div>
  `;
  render();
  document.getElementById('modal-cancel').onclick = closeModal;
  if (eligible.length === 0) return;

  const categorySelect = document.getElementById('d-category');
  const intensitySelect = document.getElementById('d-intensity');
  const writeOwnBtn = document.getElementById('btn-write-own');
  const form = document.getElementById('dare-form');
  const blindIntensitySelect = document.getElementById('d-blind-intensity');
  let pickedImagePath = null;

  function currentMaxIntensity() {
    return categorySelect.options[categorySelect.selectedIndex].dataset.max;
  }
  function populateIntensityOptions() {
    const max = currentMaxIntensity();
    const allowed = VALID_INTENSITIES.slice(0, VALID_INTENSITIES.indexOf(max) + 1);
    intensitySelect.innerHTML = allowed.map(i => `<option value="${i}">${INTENSITY_LABELS[i]} — ${INTENSITY_POINTS[i]} pts</option>`).join('');
  }
  function populateBlindIntensityOptions() {
    const max = currentMaxIntensity();
    const allowed = VALID_INTENSITIES.slice(0, VALID_INTENSITIES.indexOf(max) + 1);
    blindIntensitySelect.innerHTML = allowed.map(i => `<option value="${i}">${INTENSITY_LABELS[i]}</option>`).join('');
  }
  function updateWishlistOptionVisibility() {
    const wlBtn = document.getElementById('btn-wishlist-send');
    const wlHint = document.getElementById('wishlist-send-hint');
    if (!wlBtn) return;
    const show = state.partnerWishlistCategories.includes(categorySelect.value);
    wlBtn.style.display = show ? '' : 'none';
    wlHint.style.display = show ? '' : 'none';
  }

  const blindSendBtn = document.getElementById('btn-blind-send');
  if (blindSendBtn) blindSendBtn.onclick = async () => {
    const chosenIntensity = blindIntensitySelect.value;
    const chosenCategory = categorySelect.value;
    const partnerGender = state.partner ? state.partner.gender : null;
    const restrictByRole = chosenCategory === 'Dominance & Surrender' && ['dom', 'surrender'].includes(state.partnerRoleLean);
    const matches = state.dareLibrary.filter(d => d.category === chosenCategory && d.intensity === chosenIntensity
      && (d.suitable_gender === 'either' || d.suitable_gender === partnerGender)
      && (!restrictByRole || d.suitable_role === 'either' || d.suitable_role === state.partnerRoleLean));
    if (!matches.length) { showToast(`No library dares at ${INTENSITY_LABELS[chosenIntensity]} for this temptation yet — try a different intensity.`); return; }
    if (!confirm("Nobody will see which one this is except whoever's doing it — not even you. Send it blind?")) return;
    const picked = matches[Math.floor(Math.random() * matches.length)];
    const deadlineVal = document.getElementById('d-blind-deadline').value;
    const { error } = await sb.rpc('create_dare', {
      p_category: categorySelect.value,
      p_title: picked.title,
      p_instructions: picked.instructions,
      p_teaser: picked.teaser || null,
      p_intensity: picked.intensity,
      p_deadline: deadlineVal ? new Date(deadlineVal).toISOString() : null,
      p_requires_confirmation: false,
      p_reward_text: null,
      p_reusable: false,
      p_question_id: null,
      p_image_path: picked.image_path || null,
      p_blind_sent: true,
      p_library_dare_id: picked.id
    });
    if (error) { showToast(error.message); return; }
    closeModal();
    await loadDares();
    showToast('🙈 Sent blind — you\'ll find out together.');
  };

  categorySelect.onchange = () => { populateIntensityOptions(); populateBlindIntensityOptions(); updateWishlistOptionVisibility(); };

  const wishlistSendBtn = document.getElementById('btn-wishlist-send');
  if (wishlistSendBtn) wishlistSendBtn.onclick = async () => {
    if (!confirm(`This draws blind from something ${state.partner ? state.partner.display_name : 'they'} added themselves — you won't know which one until it's done. Send it?`)) return;
    const deadlineVal = document.getElementById('d-blind-deadline').value;
    const { error } = await sb.rpc('create_dare', {
      p_category: categorySelect.value,
      p_title: '🎁 A wish, granted',
      p_instructions: '(drawn from their wishlist)',
      p_teaser: null,
      p_intensity: blindIntensitySelect.value,
      p_deadline: deadlineVal ? new Date(deadlineVal).toISOString() : null,
      p_requires_confirmation: false,
      p_reward_text: null,
      p_reusable: false,
      p_question_id: null,
      p_image_path: null,
      p_blind_sent: true,
      p_library_dare_id: null,
      p_wishlist_draw: true
    });
    if (error) { showToast(error.message); return; }
    closeModal();
    await loadDares();
    showToast(`🎁 Sent — something ${state.partner ? state.partner.display_name : 'they'} wished for.`);
  };
  writeOwnBtn.onclick = () => {
    populateIntensityOptions();
    document.getElementById('d-title').value = '';
    document.getElementById('d-teaser').value = '';
    document.getElementById('d-instructions').value = '';
    pickedImagePath = null;
    document.getElementById('d-image-preview').innerHTML = '';
    form.style.display = '';
    form.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };
  populateIntensityOptions();
  populateBlindIntensityOptions();
  updateWishlistOptionVisibility();

  form.onsubmit = async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('dare-form-error');
    const deadlineVal = document.getElementById('d-deadline').value;
    let finalImagePath = pickedImagePath;
    const imageFile = document.getElementById('d-image').files[0];
    if (imageFile) {
      const ext = imageFile.name.split('.').pop();
      const path = `${state.coupleId}/${crypto.randomUUID()}.${ext}`;
      const { error: uploadError } = await sb.storage.from('dare-images').upload(path, imageFile);
      if (uploadError) { errEl.textContent = 'Image upload failed: ' + uploadError.message; return; }
      finalImagePath = path;
    }
    const { error } = await sb.rpc('create_dare', {
      p_category: categorySelect.value,
      p_title: document.getElementById('d-title').value.trim(),
      p_instructions: document.getElementById('d-instructions').value.trim(),
      p_teaser: document.getElementById('d-teaser').value.trim() || null,
      p_intensity: intensitySelect.value,
      p_deadline: deadlineVal ? new Date(deadlineVal).toISOString() : null,
      p_requires_confirmation: document.getElementById('d-confirm').checked,
      p_reward_text: null,
      p_reusable: false,
      p_question_id: null,
      p_image_path: finalImagePath
    });
    if (error) { errEl.textContent = error.message; return; }
    closeModal();
    await loadDares();
    showToast('Dare sent.');
  };
}

function normalizeForMatch(s) {
  return s.trim().toLowerCase().replace(/[_-]+/g, ' ').replace(/\s+/g, ' ');
}

  state.modal = `

async function runBulkImageImport(files) {
  const progressEl = document.getElementById('bulk-image-progress');
  let matched = 0;
  const unmatched = [];

  function stripExt(name) { return name.replace(/\.[^/.]+$/, ''); }

  // Two lookups: by the explicit filename hint set via CSV import (checked
  // first), and by card title (fallback), across every heading.
  const byFilename = {};
  const byTitle = {};
  state.questions.forEach(q => {
    if (q.pending_image_filename) byFilename[normalizeForMatch(stripExt(q.pending_image_filename))] = q;
    byTitle[normalizeForMatch(q.title)] = q;
  });

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    if (progressEl) progressEl.textContent = `Matching image ${i + 1} of ${files.length}…`;
    const key = normalizeForMatch(stripExt(file.name));
    const q = byFilename[key] || byTitle[key];
    if (!q) { unmatched.push(file.name); continue; }

    const ext = file.name.split('.').pop();
    const path = `${state.coupleId}/${crypto.randomUUID()}.${ext}`;
    const { error: uploadError } = await sb.storage.from('boundary-images').upload(path, file);
    if (uploadError) { unmatched.push(`${file.name} (upload failed: ${uploadError.message})`); continue; }

    const { error: updateError } = await sb.from('boundary_questions')
      .update({ image_path: path, pending_image_filename: null }).eq('id', q.id);
    if (updateError) { unmatched.push(`${file.name} (couldn't save: ${updateError.message})`); continue; }

    matched++;
  }

  await loadQuestions();
  if (progressEl) {
    progressEl.innerHTML = `<b>${matched} image${matched===1?'':'s'} attached, ${unmatched.length} unmatched.</b>` +
      (unmatched.length ? `<div style="margin-top:8px; max-height:150px; overflow-y:auto">${unmatched.map(f => `<div>${esc(f)} — no matching filename or title found.</div>`).join('')}</div>` : '');
  }
}

async function runCsvImport(rows) {
  const progressEl = document.getElementById('import-progress');
  // Case-insensitive lookup: normalized name -> the heading's real, correctly-cased name.
  const categoryLookup = {};
  state.categories.forEach(c => { categoryLookup[c.name.trim().toLowerCase()] = c.name; });
  let added = 0, skipped = 0;
  const errors = [];

  // Accepts a small set of likely alternate header names, since imported
  // files won't always use our exact column names or casing.
  function pick(row, ...keys) {
    for (const k of keys) { if (row[k] !== undefined && row[k] !== '') return row[k]; }
    return '';
  }
  // Strips accents (e.g. "Risqué" -> "risque") so values with accented
  // characters still match, regardless of case.
  function normalize(s) {
    return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
  }

  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const lineNum = i + 2; // account for header row, 1-indexed
    const category = pick(row, 'category', 'heading', 'temptation', 'category_heading').trim();
    const title = pick(row, 'title', 'name', 'card_title').trim();
    const explanation = pick(row, 'explanation', 'description', 'details').trim() || null;
    const rawIntensity = pick(row, 'max_intensity', 'intensity');
    const rawSuitable = pick(row, 'suitable_for', 'type', 'dare_type');
    const imageFilename = pick(row, 'image_filename', 'image', 'filename').trim() || null;
    const rawIsGeneral = pick(row, 'is_general', 'general').trim().toLowerCase();
    const isGeneral = ['true', 'yes', '1'].includes(rawIsGeneral);
    let intensity = normalize(rawIntensity);
    let suitable = normalize(rawSuitable);

    if (progressEl) progressEl.textContent = `Importing row ${i + 1} of ${rows.length}…`;

    if (!category || !title) {
      skipped++; errors.push(`Row ${lineNum}: missing category or title — skipped.`); continue;
    }
    if (!VALID_INTENSITIES.includes(intensity)) {
      const looksShifted = rawIntensity.length > 25;
      const hint = looksShifted
        ? ` — this looks like description text, not an intensity level. Check row ${lineNum} in your source file for an un-quoted comma in the description that may have shifted the columns.`
        : '';
      skipped++; errors.push(`Row ${lineNum}: invalid max_intensity "${rawIntensity}"${hint} — skipped.`); continue;
    }
    if (!VALID_TYPES.includes(suitable)) suitable = 'either';

    const categoryKey = category.toLowerCase();
    let resolvedCategory = categoryLookup[categoryKey];
    if (!resolvedCategory) {
      const { error: catErr } = await sb.rpc('add_boundary_category', { p_name: category });
      if (catErr) { skipped++; errors.push(`Row ${lineNum}: couldn't create temptation "${category}" — skipped.`); continue; }
      resolvedCategory = category;
      categoryLookup[categoryKey] = category;
    }

    const { data: newId, error } = await sb.rpc('add_boundary_question', {
      p_category: resolvedCategory, p_title: title, p_explanation: explanation, p_image_path: null,
      p_max_intensity: intensity, p_suitable_for: suitable, p_is_general: isGeneral
    });
    if (error) { skipped++; errors.push(`Row ${lineNum}: ${error.message}`); continue; }
    if (imageFilename && newId) {
      await sb.from('boundary_questions').update({ pending_image_filename: imageFilename }).eq('id', newId);
    }
    added++;
  }

  await loadCategories();
  await loadQuestions();
  if (progressEl) {
    progressEl.innerHTML = `<b>${added} card${added===1?'':'s'} added, ${skipped} skipped.</b>` +
      (errors.length ? `<div style="margin-top:8px; max-height:150px; overflow-y:auto">${errors.map(e => `<div>${esc(e)}</div>`).join('')}</div>` : '');
  }
  // Note: intentionally not calling render() here — state.modal is a static
  // snapshot taken when the modal opened, and re-rendering it would wipe out
  // the summary we just wrote directly into the DOM. Categories/questions are
  // already reloaded, so the boundaries list will show fresh counts as soon
  // as the modal is closed.
}

async function runDaresCsvImport(rows) {
  const progressEl = document.getElementById('dares-import-progress');
  const knownCategories = new Set(state.categories.map(c => c.name.toLowerCase()));
  let added = 0, skipped = 0;
  const errors = [];

  function normalize(s) {
    return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
  }

  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const lineNum = i + 2;
    const category = (row.category || '').trim();
    const title = (row.title || '').trim();
    const teaser = (row.teaser || '').trim() || null;
    const instructions = (row.instructions || '').trim();
    const intensity = normalize(row.intensity);
    const rawGender = normalize(row.suitable_gender);
    const suitableGender = ['male', 'female', 'either'].includes(rawGender) ? rawGender : 'either';
    const rawRole = normalize(row.suitable_role);
    const suitableRole = ['dom', 'surrender', 'either'].includes(rawRole) ? rawRole : 'either';

    if (progressEl) progressEl.textContent = `Importing row ${i + 1} of ${rows.length}…`;

    if (!category || !title || !instructions) {
      skipped++; errors.push(`Row ${lineNum}: missing category, title, or instructions — skipped.`); continue;
    }
    if (!knownCategories.has(category.toLowerCase())) {
      skipped++; errors.push(`Row ${lineNum}: "${category}" doesn't match an existing temptation — skipped.`); continue;
    }
    if (!VALID_INTENSITIES.includes(intensity)) {
      skipped++; errors.push(`Row ${lineNum}: invalid intensity "${row.intensity || ''}" — skipped.`); continue;
    }

    const { error } = await sb.rpc('add_library_dare', {
      p_category: category, p_title: title, p_teaser: teaser, p_instructions: instructions, p_intensity: intensity, p_suitable_gender: suitableGender, p_suitable_role: suitableRole
    });
    if (error) { skipped++; errors.push(`Row ${lineNum}: ${error.message}`); continue; }
    added++;
  }

  await loadDareLibrary();
  if (progressEl) {
    progressEl.innerHTML = `<b>${added} dare${added===1?'':'s'} added, ${skipped} skipped.</b>` +
      (errors.length ? `<div style="margin-top:8px; max-height:150px; overflow-y:auto">${errors.map(e => `<div>${esc(e)}</div>`).join('')}</div>` : '');
  }
}

        <div class="field" style="margin-bottom:16px">
          <label>Evidence photo (optional)</label>
          <input type="file" id="evidence-file" accept="image/*">
        </div>
        <div class="stack">
          <button class="btn btn-primary" data-complete-kind="no_proof" data-complete-id="${dareId}">Completed</button>
          <button class="btn btn-ghost" data-complete-kind="proof_in_person" data-complete-id="${dareId}">Completed — proof shown in person</button>
          <button class="btn btn-ghost" data-complete-kind="proof_sent_externally" data-complete-id="${dareId}">Completed — proof sent separately</button>
          <button class="btn btn-ghost" data-complete-kind="confirmed_by_partner" data-complete-id="${dareId}">Completed — confirmed by ${esc(state.partner ? state.partner.display_name : 'partner')}</button>
          <button class="link-btn" id="modal-cancel">Cancel</button>
        </div>
      </div>
    </div>
  `;
  render();
  document.getElementById('modal-cancel').onclick = closeModal;
  $app.querySelectorAll('[data-complete-kind]').forEach(el => el.onclick = async () => {
    const completedDare = state.dares.find(d => d.id === el.dataset.completeId);
    const category = completedDare ? completedDare.category : null;
    const evidenceFile = document.getElementById('evidence-file').files[0];
    const { error } = await sb.rpc('complete_dare', { p_dare_id: el.dataset.completeId, p_completion_kind: el.dataset.completeKind });
    if (error) { showToast(error.message); return; }
    if (evidenceFile) {
      const ext = evidenceFile.name.split('.').pop();
      const path = `${state.coupleId}/${el.dataset.completeId}/${crypto.randomUUID()}.${ext}`;
      const { error: uploadError } = await sb.storage.from('dare-evidence').upload(path, evidenceFile);
      if (!uploadError) {
        await sb.from('dare_evidence').insert({ dare_id: el.dataset.completeId, couple_id: state.coupleId, uploaded_by: state.session.user.id, path });
      }
    }
    await Promise.all([loadDares(), loadScoreboard(), loadHeat(), loadDareEvidence()]);
    const updatedDare = state.dares.find(d => d.id === el.dataset.completeId);
    const followUp = category ? state.questions.find(q => q.category === category && !state.answers[q.id]) : null;
    closeModal();
    const heatGain = updatedDare ? Math.max(1, Math.round((updatedDare.points_awarded || 0) / 10)) : 0;
    celebrateCompletion({
      title: updatedDare ? updatedDare.title : 'Dare',
      byName: state.profile ? state.profile.display_name : 'You',
      points: updatedDare ? updatedDare.points_awarded : 0,
      bonusPoints: updatedDare ? updatedDare.quality_bonus_points : 0,
      heatGain,
      onContinue: () => openDoerFeedbackModal(updatedDare, () => { if (followUp) openFollowUpQuestionModal(followUp); })
    });
  });
}

async function openEvidenceModal(id, type = 'dare') {
  const items = type === 'forfeit'
    ? state.forfeitEvidence.filter(e => e.settlement_id === id)
    : state.dareEvidence.filter(e => e.dare_id === id);
  const bucket = type === 'forfeit' ? 'forfeit-evidence' : 'dare-evidence';
  state.modal = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal-sheet">
        <h2>Evidence</h2>
        <div id="evidence-images" class="hint-text">Loading…</div>
        <button class="btn btn-ghost" id="modal-cancel" style="margin-top:16px">Close</button>
      </div>
    </div>
  `;
  render();
  document.getElementById('modal-cancel').onclick = closeModal;

  const urls = await Promise.all(items.map(async (e) => {
    const { data } = await sb.storage.from(bucket).createSignedUrl(e.path, 3600);
    return data ? data.signedUrl : null;
  }));
  const box = document.getElementById('evidence-images');
  if (box) {
    box.innerHTML = urls.filter(Boolean).map(u => `<img src="${esc(u)}" style="width:100%; border-radius:var(--radius-s); margin-bottom:10px;">`).join('')
      || 'Could not load evidence.';
  }
}

function openForfeitPickerModal(settlement) {
  const myGender = state.profile ? state.profile.gender : null;
  const eligible = state.forfeitLibrary.filter(f => {
    if (f.suitable_gender !== 'either' && f.suitable_gender !== myGender) return false;
    if (!f.is_intimate) return true;
    const access = state.headingAccess.find(h => h.category === f.category);
    if (!access || access.access === 'off_table' || access.access === 'pending') return false;
    const max = TIER_MAX_INTENSITY[access.access];
    return VALID_INTENSITIES.indexOf(f.intensity) <= VALID_INTENSITIES.indexOf(max);
  });
  const everyday = eligible.filter(f => !f.is_intimate);
  const risque = eligible.filter(f => f.is_intimate);
  const winnerName = state.partner ? state.partner.display_name : 'They';

  // The lowest tier that's still genuinely open (not off the table, not
  // still pending) — a gentle nudge toward least-confident-but-willing
  // territory, never toward something already off limits or already a
  // favourite (no nudge needed there).
  const openTiers = state.headingAccess.filter(h => TIER_ORDER.includes(h.access));
  const lowestOpen = openTiers.length
    ? openTiers.reduce((worst, h) => TIER_ORDER.indexOf(h.access) > TIER_ORDER.indexOf(worst.access) ? h : worst)
    : null;
  const suggested = lowestOpen ? risque.filter(f => f.category === lowestOpen.category) : [];

  state.modal = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal-sheet">
        <h2>This week goes to ${esc(winnerName)}</h2>
        <p class="hint-text" style="margin-bottom:18px">${settlement.loser_points} to ${settlement.winner_points} — pick your own forfeit. Nobody's choosing this for you. First: which pool are you drawing from?</p>
        ${suggested.length ? `
        <div class="category-row" data-choose-pool="suggested" style="cursor:pointer; border:1.5px solid var(--gold); margin-bottom:14px">
          <div>
            <div class="cat-name">Suggested for you</div>
            <div class="cat-count">${suggested.length} in ${esc(lowestOpen.category)} — you're just getting started there, so this nudges gently in that direction</div>
          </div>
          <div class="cat-arrow">›</div>
        </div>
        ` : ''}
        <div class="category-row" data-choose-pool="everyday" style="cursor:pointer">
          <div>
            <div class="cat-name">Everyday</div>
            <div class="cat-count">${everyday.length} forfeit${everyday.length===1?'':'s'} · nothing intimate</div>
          </div>
          <div class="cat-arrow">›</div>
        </div>
        <div class="category-row" data-choose-pool="risque" style="cursor:pointer">
          <div>
            <div class="cat-name">Risqué</div>
            <div class="cat-count">${risque.length} forfeit${risque.length===1?'':'s'} · intimate, capped to what's currently open</div>
          </div>
          <div class="cat-arrow">›</div>
        </div>
        <button class="link-btn" id="modal-cancel" style="margin-top:16px">Decide later</button>
      </div>
    </div>
  `;
  render();
  document.getElementById('modal-cancel').onclick = closeModal;
  $app.querySelectorAll('[data-choose-pool]').forEach(el => el.onclick = () => {
    const poolKey = el.dataset.choosePool;
    const pool = poolKey === 'everyday' ? everyday : poolKey === 'suggested' ? suggested : risque;
    const poolLabel = poolKey === 'everyday' ? 'everyday' : poolKey === 'suggested' ? 'suggested' : 'risque';
    openForfeitPoolModal(settlement, pool, poolLabel);
  });
}

function openForfeitPoolModal(settlement, pool, poolName) {
  const winnerName = state.partner ? state.partner.display_name : 'They';
  state.modal = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal-sheet">
        <h2>${poolName === 'everyday' ? 'Everyday' : poolName === 'suggested' ? 'Suggested' : 'Risqué'} pool</h2>
        ${pool.length ? `
          <button class="btn btn-gold" id="btn-surprise-forfeit" style="width:100%; margin-bottom:14px">🎲 Surprise me — draw one at random</button>
          <p class="hint-text" style="margin-bottom:10px">Or browse and pick one yourself:</p>
          ${pool.map(f => `
            <div class="category-row" data-pick-forfeit="${f.id}" style="cursor:pointer">
              <div>
                <div class="cat-name" style="font-size:14.5px">${esc(f.title)}</div>
                <div class="cat-count">${f.is_intimate ? `${esc(f.category)} · <span class="pill intensity-${f.intensity}">${INTENSITY_LABELS[f.intensity]}</span>` : 'Non-intimate'}</div>
              </div>
              <div class="cat-arrow">›</div>
            </div>
          `).join('')}
        ` : `<div class="empty-state">Nothing in this pool right now.</div>`}
        <button class="link-btn" id="btn-back-to-pools" style="margin-top:16px">‹ Back to pools</button>
        <button class="link-btn" id="modal-cancel" style="margin-top:8px">Decide later</button>
      </div>
    </div>
  `;
  render();
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('btn-back-to-pools').onclick = () => openForfeitPickerModal(settlement);
  const surpriseBtn = document.getElementById('btn-surprise-forfeit');
  if (surpriseBtn) surpriseBtn.onclick = () => {
    const picked = pool[Math.floor(Math.random() * pool.length)];
    confirmForfeitPick(settlement, picked.id);
  };
  $app.querySelectorAll('[data-pick-forfeit]').forEach(el => el.onclick = () => confirmForfeitPick(settlement, el.dataset.pickForfeit));
}

async function confirmForfeitPick(settlement, forfeitId) {
  const { error } = await sb.rpc('pick_forfeit', { p_settlement_id: settlement.id, p_forfeit_id: forfeitId });
  if (error) { showToast(error.message); return; }
  await loadCurrentSettlement();
  closeModal();
  showToast('Forfeit picked.');
}

function openDoerFeedbackModal(dare, onContinue) {
  if (!dare) { onContinue(); return; }
  state.modal = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal-sheet">
        <h2>How did that feel?</h2>
        <p class="hint-text" style="margin-bottom:18px">Just for you two — this doesn't affect scoring, it just helps shape what gets picked in future.</p>
        <div class="btn-row">
          <button class="btn btn-ghost" data-doer-reaction="meh">Meh</button>
          <button class="btn btn-ghost" data-doer-reaction="good">Good</button>
          <button class="btn btn-ghost" data-doer-reaction="loved_it">Loved it</button>
        </div>
        <button class="link-btn" id="btn-skip-doer-feedback" style="margin-top:16px">Skip</button>
      </div>
    </div>
  `;
  render();
  const finish = () => { closeModal(); onContinue(); };
  document.getElementById('btn-skip-doer-feedback').onclick = finish;
  $app.querySelectorAll('[data-doer-reaction]').forEach(el => el.onclick = async () => {
    await sb.rpc('react_as_doer', { p_dare_id: dare.id, p_reaction: el.dataset.doerReaction });
    finish();
  });
}

function openFollowUpQuestionModal(q) {
  state.modal = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal-sheet">
        <h2>Nice work — points added</h2>
        <p class="hint-text" style="margin-bottom:14px">Since you just completed one from ${esc(q.category)}, here's another question from that temptation, if you're up for it.</p>
        <div class="deck-card-title" style="margin-bottom:8px">${esc(q.title)}</div>
        ${q.explanation ? `<div class="deck-card-explain" style="margin-bottom:12px">${esc(q.explanation)}</div>` : ''}
        ${renderAnswerControl(q, null, (a) => `data-followup-answer="${a}" data-followup-id="${q.id}"`)}
        <button class="link-btn" id="modal-cancel" style="margin-top:16px">Skip for now</button>
      </div>
    </div>
  `;
  render();
  document.getElementById('modal-cancel').onclick = () => { closeModal(); checkForPendingForfeit(); };
  $app.querySelectorAll('[data-followup-answer]').forEach(el => el.onclick = async () => {
    const qId = el.dataset.followupId, val = el.dataset.followupAnswer;
    state.answers[qId] = val;
    await sb.from('boundary_answers').upsert({ user_id: state.session.user.id, question_id: qId, answer: val, updated_at: new Date().toISOString() }, { onConflict: 'user_id,question_id' });
    await loadBoundary(); await loadHeadingAccess(); await loadCardReport();
    closeModal();
    showToast('Answer saved.');
    checkForPendingForfeit();
  });
}

// Keeps in-play countdowns ticking without needing a data refresh — only
// re-renders when there's actually a live countdown on screen, to avoid
// pointless work the rest of the time.
setInterval(() => {
  if (state.session && !state.modal && state.dares.some(d => ['accepted','in_progress','countered'].includes(d.status) && d.deadline)) {
    render();
  }
}, 30000);

boot();

</script>
</body>
</html>
