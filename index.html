<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  :root{
    /* Neutral default, used before a theme (gender) is chosen — auth/signup only */
    --bg:#F6F3F0;
    --surface:#FFFFFF;
    --surface-raised:#EFEAE4;
    --line:#E2DAD2;
    --wine:#8C5A46;
    --wine-bright:#A8735D;
    --gold:#B98A4E;
    --text:#2B2622;
    --text-dim:#71675D;
    --text-faint:#A89C90;
    --good:#6B8F63;
    --radius-s:6px;
    --radius-m:10px;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  /* Lighter, warmer theme */
  body.theme-female{
    --bg:#FBF2F3;
    --surface:#FFFFFF;
    --surface-raised:#FCE8EB;
    --line:#F1D6DC;
    --wine:#C2607B;
    --wine-bright:#D97C97;
    --gold:#B98A4E;
    --text:#3D2A30;
    --text-dim:#8C6E76;
    --text-faint:#B79CA3;
    --good:#6B8F63;
  }
  /* Lighter, cooler theme */
  body.theme-male{
    --bg:#F1F5FA;
    --surface:#FFFFFF;
    --surface-raised:#E6EDF5;
    --line:#D6E2EE;
    --wine:#3D6690;
    --wine-bright:#4F7FAE;
    --gold:#B98A4E;
    --text:#24313E;
    --text-dim:#66788A;
    --text-faint:#9AACBC;
    --good:#6B8F63;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:15px;

    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  h1,h2,h3{font-family:var(--serif); font-weight:500; margin:0;}
  a{color:inherit;}
  button{font-family:var(--sans); cursor:pointer;}
  input,select,textarea{font-family:var(--sans);}
  ::selection{background:var(--wine); color:var(--text);}

  #app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:22px 20px 14px;
  }
  .topbar .wordmark{font-family:var(--serif); font-size:22px; letter-spacing:0.2px; color:var(--gold);}
  .topbar .version{font-size:11px; color:var(--text-faint);}

  /* ---------- generic layout ---------- */
  .screen{padding:0 20px 100px; flex:1;}
  .center-screen{flex:1; display:flex; flex-direction:column; justify-content:center; padding:20px;}
  .stack{display:flex; flex-direction:column; gap:14px;}
  .field label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:6px;}
  .field input, .field textarea, .field select{
    width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text);
    border-radius:var(--radius-s); padding:11px 12px; font-size:15px;
  }
  .field textarea{resize:vertical; min-height:70px;}
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:2px solid var(--gold); outline-offset:1px; border-color:var(--gold);
  }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:var(--radius-s); padding:12px 18px;
    font-size:14.5px; font-weight:600; width:100%;
  }
  .btn-primary{background:var(--wine); color:#fff;}
  .btn-primary:active{background:var(--wine-bright);}
  .btn-ghost{background:transparent; color:var(--text-dim); border:1px solid var(--line);}
  .btn-gold{background:var(--gold); color:#1B1714;}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{width:auto; flex:1;}
  .btn-small{padding:8px 12px; font-size:13px; width:auto;}
  .btn:disabled{opacity:0.45;}
  .link-btn{background:none; border:none; color:var(--text-dim); text-decoration:underline; font-size:13px; padding:6px 0;}

  .error-text{color:var(--wine-bright); font-size:13px;}
  .hint-text{color:var(--text-faint); font-size:12.5px;}

  .divider{height:1px; background:var(--line); margin:22px 0;}

  /* ---------- auth screen ---------- */
  .auth-hero{margin-bottom:34px;}
  .auth-hero h1{font-size:30px; color:var(--text); margin-bottom:6px;}
  .auth-hero p{color:var(--text-dim); font-size:14px; max-width:34ch;}
  .auth-tabs{display:flex; gap:22px; margin-bottom:20px; border-bottom:1px solid var(--line);}
  .auth-tab{background:none; border:none; color:var(--text-faint); padding:8px 0; font-size:14px; font-weight:600; border-bottom:2px solid transparent;}
  .auth-tab.active{color:var(--gold); border-bottom-color:var(--gold);}

  /* ---------- pairing ---------- */
  .code-display{
    font-family:var(--serif); font-size:38px; letter-spacing:6px; color:var(--gold);
    text-align:center; padding:26px 0; background:var(--surface); border-radius:var(--radius-m);
    border:1px solid var(--line);
  }

  /* ---------- status banner (home) ---------- */
  .status-strip{
    padding:16px 20px; margin:0 -20px 22px; background:var(--surface);
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  }
  .status-strip .status-label{font-size:11.5px; color:var(--text-faint); margin-bottom:3px;}
  .status-strip .status-value{font-family:var(--serif); font-size:19px; color:var(--text);}
  .status-strip .status-value.awaiting{color:var(--gold);}

  /* ---------- scoreboard ---------- */
  .scoreboard{display:flex; gap:12px; margin-bottom:18px;}
  .score-card{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px;}
  .score-card.leading{border-color:var(--gold);}
  .score-card .name{font-size:12px; color:var(--text-dim); margin-bottom:4px;}
  .score-card .points{font-family:var(--serif); font-size:32px; color:var(--text);}
  .score-card .points span{font-size:14px; color:var(--text-faint);}

  /* ---------- heat meter ---------- */
  .heat-block{margin-bottom:22px;}
  .heat-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .heat-head .label{font-size:12px; color:var(--text-dim);}
  .heat-head .pct{font-family:var(--serif); font-size:16px; color:var(--gold);}
  .heat-track{height:8px; background:var(--surface); border-radius:99px; overflow:hidden; border:1px solid var(--line);}
  .heat-fill{height:100%; background:linear-gradient(90deg, var(--wine), var(--gold)); transition:width 0.5s ease;}
  .heat-next{font-size:12px; color:var(--text-faint); margin-top:6px;}

  /* ---------- section headers ---------- */
  .section-head{display:flex; justify-content:space-between; align-items:center; margin:26px 0 12px;}
  .section-head h2{font-size:15px; color:var(--text); font-weight:600; font-family:var(--sans);}
  .section-head .see-all{font-size:12.5px; color:var(--text-faint); background:none; border:none;}

  /* ---------- dare card ---------- */
  .dare{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m);
    padding:16px; margin-bottom:10px; position:relative; overflow:hidden;
  }
  .dare.locked{border-left:3px solid var(--wine);}
  .dare.unlocked{border-left:3px solid var(--gold);}
  .dare-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px;}
  .dare-title{font-family:var(--serif); font-size:17px; color:var(--text);}
  .dare-meta{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .pill{
    font-size:11px; padding:3px 9px; border-radius:99px; border:1px solid var(--line); color:var(--text-dim);
    white-space:nowrap;
  }
  .pill.intensity-tease{background:#EAF3E4; color:#4B6B3E; border-color:#CFE3C2;}
  .pill.intensity-risque{background:#FBEEDC; color:#8A5A1E; border-color:#F0D9B0;}
  .pill.intensity-bold{background:#FBE6DC; color:#9A4A22; border-color:#F0C3AC;}
  .pill.intensity-wild{background:#FBE3E6; color:#9A2F3D; border-color:#F0BEC5;}
  .pill.access-full{background:#FBF1DC; color:#8A6A1E; border-color:#F0DFB0; font-weight:600;}
  .dare-body{color:var(--text-dim); font-size:13.5px; margin-bottom:12px;}
  .dare-instructions{color:var(--text); font-size:14px; margin-bottom:12px; line-height:1.55;}
  .dare-points{font-size:12px; color:var(--gold);}

  /* ---------- notification / toast ---------- */
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--surface-raised); border:1px solid var(--gold); color:var(--text);
    padding:12px 18px; border-radius:var(--radius-s); font-size:13.5px; max-width:88%;
    box-shadow:0 8px 24px rgba(0,0,0,0.4); z-index:200;
  }

  /* ---------- bottom nav ---------- */
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; background:var(--surface-raised);
    border-top:1px solid var(--line); padding:8px 0 calc(8px + env(safe-area-inset-bottom));
    display:flex; max-width:520px; margin:0 auto;
  }
  .tab{
    flex:1; background:none; border:none; color:var(--text-faint); font-size:11px;
    display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 0;
  }
  .tab.active{color:var(--gold);}
  .tab .dot{width:6px; height:6px; border-radius:50%; background:var(--wine-bright); position:absolute; margin-left:14px; margin-top:-2px;}

  .empty-state{color:var(--text-faint); font-size:13.5px; padding:24px 0; text-align:center;}

  .qa-row{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px; margin-bottom:10px;}
  .qa-cat{font-size:11px; color:var(--text-faint); margin-bottom:4px;}
  .qa-title{font-size:14.5px; color:var(--text); margin-bottom:3px;}
  .qa-explain{font-size:12.5px; color:var(--text-dim); margin-bottom:12px;}
  .qa-options{display:flex; gap:6px; flex-wrap:wrap;}
  .qa-opt{
    background:var(--bg); border:1px solid var(--line); color:var(--text-dim);
    padding:7px 11px; border-radius:99px; font-size:12.5px;
  }
  .qa-opt.selected{background:var(--gold); color:#1B1714; border-color:var(--gold); font-weight:600;}

  .boundary-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line);}
  .boundary-row:last-child{border-bottom:none;}
  .boundary-row .cat{font-size:14px; color:var(--text);}
  .boundary-row .lvl{font-size:12px; color:var(--text-faint);}
  .boundary-row.excluded{opacity:0.4;}

  .category-row{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m);
    padding:16px; margin-bottom:8px;
  }
  .category-row .cat-name{font-family:var(--serif); font-size:16px; color:var(--text);}
  .category-row .cat-count{font-size:12px; color:var(--text-faint); margin-top:2px;}
  .category-row .cat-arrow{color:var(--text-faint); font-size:18px;}

  .deck-progress{font-size:12px; color:var(--text-faint); text-align:center; margin-bottom:10px;}
  .deck-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m);
    padding:0; margin-bottom:16px; overflow:hidden;
  }
  .deck-card img{width:100%; display:block; aspect-ratio:4/3; object-fit:cover; background:var(--surface-raised);}
  .deck-card-body{padding:18px;}
  .deck-card-title{font-family:var(--serif); font-size:20px; color:var(--text); margin-bottom:8px;}
  .deck-card-explain{font-size:14px; color:var(--text-dim); line-height:1.6; margin-bottom:16px;}
  .deck-answers{display:flex; flex-direction:column; gap:8px;}
  .deck-answer-btn{
    background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:13px 14px; border-radius:var(--radius-s); font-size:14px; text-align:left;
  }
  .deck-answer-btn.selected{background:var(--wine); border-color:var(--wine); color:#fff; font-weight:600;}

  .answer-gauge{position:relative; padding:6px 0 4px; margin-top:6px;}
  .gauge-track{
    position:absolute; top:26px; left:22px; right:22px; height:3px; border-radius:2px;
    background:linear-gradient(90deg, #3D6690, #7FAAC7, #A8A196, #D9A65C, #C24C63);
  }
  .gauge-row{display:flex; justify-content:space-between; position:relative; z-index:1;}
  .gauge-stop{
    width:44px; height:44px; border-radius:50%; background:var(--surface); border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0;
  }
  .gauge-stop.selected{border-color:var(--gold); background:var(--gold); transform:scale(1.08);}

  .teaser-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:20px 0;}
  .teaser-block{height:44px; border-radius:var(--radius-s); opacity:0.9;}
  .teaser-block.cold_card{background:#3D6690;}
  .teaser-block.just_for_you{background:#7FAAC7;}
  .teaser-block.blushing_yes{background:#A8A196;}
  .teaser-block.warming_up{background:#D9A65C;}
  .teaser-block.full_spark{background:#C24C63;}
  .teaser-legend{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:20px;}
  .teaser-legend-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim);}
  .teaser-legend-swatch{width:12px; height:12px; border-radius:3px; flex-shrink:0;}
  .privacy-note{
    background:var(--surface); border:1px solid var(--good); border-radius:var(--radius-m);
    padding:14px 16px; margin-bottom:22px;
  }
  .privacy-note .title{font-weight:600; font-size:14px; color:var(--text); margin-bottom:4px;}
  .privacy-note .body{font-size:13px; color:var(--text-dim);}
  .deck-nav{display:flex; justify-content:space-between; align-items:center; margin-top:14px;}
  .deck-nav button{background:none; border:none; color:var(--text-dim); font-size:14px; padding:8px;}
  .deck-nav button:disabled{opacity:0.3;}

  .image-upload-row{display:flex; align-items:center; gap:12px;}
  .image-preview{width:64px; height:64px; border-radius:var(--radius-s); object-fit:cover; background:var(--surface-raised); border:1px solid var(--line);}

  .modal-backdrop{

    position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:300;
    display:flex; align-items:flex-end;
  }
  .modal-sheet{
    background:var(--surface-raised); width:100%; max-width:520px; margin:0 auto;
    border-radius:16px 16px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto;
  }
  .modal-sheet h2{font-size:19px; margin-bottom:16px;}

  .loading{display:flex; align-items:center; justify-content:center; height:100vh; color:var(--text-faint); font-size:13px;}
</style>
</head>

<script>

<script>
/* ==========================================================================
   THE GAME — v1.0 app logic
   Vanilla JS, single-page, mobile-first. No build step, no framework.
   ========================================================================== */

const $app = document.getElementById('app');

const ANSWER_LABELS = {
  full_spark: 'Full Spark', warming_up: 'Warming Up', blushing_yes: 'Blushing Yes', just_for_you: 'Just For You', cold_card: 'Cold Card'
};
const ANSWER_ORDER = ['full_spark', 'warming_up', 'blushing_yes', 'just_for_you', 'cold_card'];
const GAUGE_ORDER = ['cold_card', 'just_for_you', 'blushing_yes', 'warming_up', 'full_spark'];
const GAUGE_ICONS = { full_spark: '❤️', warming_up: '🧡', blushing_yes: '🤍', just_for_you: '💙', cold_card: '❄️' };
const INTENSITY_LABELS = { tease: 'Tease', risque: 'Risqué', bold: 'Bold', wild: 'Wild' };
const INTENSITY_POINTS = { tease: 10, risque: 25, bold: 50, wild: 100 };
const TYPE_LABELS = { apart: 'Apart', together: 'Together', either: 'Either', reunion: 'Reunion' };
const HEAT_THRESHOLDS = [25, 50, 75, 100];

let state = {
  session: null,
  profile: null,
  coupleId: null,
  partner: null,
  tab: 'home',
  categories: [],      // boundary_categories rows
  questions: [],
  answers: {},        // question_id -> answer
  boundary: [],        // computed shared boundary rows
  imageUrls: {},        // image_path -> signed URL
  openCategory: null,    // category name currently open as a deck, or null for the list view
  deckIndex: 0,          // position within the open deck
  deckViewMode: 'card',   // 'card' (one at a time) or 'list' (browsable list) within an open heading
  deckFilter: '',         // search text filtering the list view
  wizardSkipped: new Set(),  // question ids skipped this session — a safety valve so the guided wizard never truly traps anyone
  expandedHeadings: new Set(),  // which headings are expanded in the Kinks tab accordion
  headingAccess: [],          // per-heading tier unlock, from get_heading_access()
  cardReport: [],              // per-card joint tiers, from get_card_report()
  partnerTeaser: [],            // partner's already-given general answers, shuffled — from get_partner_teaser()
  viewedTeaser: false,           // shown once per login, before the wizard, if the partner's already started
  viewingSetup: false,          // whether the Boundaries tab is showing the Setup area instead of the report
  viewingAllAnswers: false,      // whether the full answer-review screen is open
  allAnswersFilter: '',
  dares: [],
  scoreboard: [],
  heat: 0,
  rewards: [],
  notifications: [],
  loading: true,
  authMode: 'signin',
  authError: '',
  toast: null,
};

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg) {
  state.toast = msg;
  render();
  setTimeout(() => { state.toast = null; render(); }, 3200);
}
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' · ' +
         d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

/* ==========================================================================
   BOOTSTRAP
   ========================================================================== */
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  state.session = session;
  sb.auth.onAuthStateChange((_event, session) => {
    state.session = session;
    if (session) loadEverything(); else { resetState(); render(); }
  });
  if (session) await loadEverything(); else state.loading = false;
  render();
}

function resetState() {
  state.profile = null; state.coupleId = null; state.partner = null;
  state.categories = []; state.questions = []; state.answers = {}; state.boundary = [];
  state.imageUrls = {}; state.openCategory = null; state.deckIndex = 0;
  state.wizardSkipped = new Set();
  state.headingAccess = []; state.viewingSetup = false;
  state.cardReport = []; state.partnerTeaser = []; state.viewedTeaser = false; state.expandedHeadings = new Set();
  state.viewingAllAnswers = false; state.allAnswersFilter = '';
  state.dares = []; state.scoreboard = []; state.heat = 0; state.rewards = [];
  state.notifications = []; state.tab = 'home';
  applyTheme(null);
}

function applyTheme(gender) {
  document.body.classList.remove('theme-male', 'theme-female');
  if (gender === 'male') document.body.classList.add('theme-male');
  if (gender === 'female') document.body.classList.add('theme-female');
}

async function loadEverything() {
  state.loading = true; render();
  try {
    await loadProfile();
    applyTheme(state.profile ? state.profile.gender : null);
    if (state.profile) {
      await loadCouple();
      if (state.coupleId) {
        await Promise.all([
          loadCategories(), loadQuestions(), loadOwnAnswers(), loadBoundary(), loadHeadingAccess(), loadCardReport(), loadPartnerTeaser(),
          loadDares(), loadScoreboard(), loadHeat(), loadRewards(), loadNotifications()
        ]);
        subscribeRealtime();
      }
    }
  } catch (e) {
    console.error(e);
  }
  state.loading = false;
  render();
}

async function loadProfile() {
  const { data } = await sb.from('profiles').select('*').eq('id', state.session.user.id).maybeSingle();
  state.profile = data || null;
}

async function loadCouple() {
  const { data } = await sb.from('couple_members').select('couple_id').eq('user_id', state.session.user.id).maybeSingle();
  state.coupleId = data ? data.couple_id : null;
  state.partner = null;
  state.pendingInviteCode = null;
  if (state.coupleId) {
    const { data: partner } = await sb.rpc('get_partner_profile');
    state.partner = (partner && partner[0]) || null;
    if (!state.partner) {
      const { data: code } = await sb.rpc('get_active_invite_code');
      state.pendingInviteCode = code || null;
    }
  }
}

async function loadCategories() {
  const { data } = await sb.from('boundary_categories').select('*').order('sort_order');
  state.categories = data || [];
}
async function loadQuestions() {
  const { data } = await sb.from('boundary_questions').select('*').eq('active', true).order('sort_order');
  state.questions = data || [];
}
async function loadOwnAnswers() {
  const { data } = await sb.from('boundary_answers').select('question_id, answer').eq('user_id', state.session.user.id);
  state.answers = {};
  (data || []).forEach(r => state.answers[r.question_id] = r.answer);
}
async function loadBoundary() {
  const { data, error } = await sb.rpc('compute_shared_boundary');
  state.boundary = error ? [] : (data || []);
}
async function loadHeadingAccess() {
  const { data, error } = await sb.rpc('get_heading_access');
  state.headingAccess = error ? [] : (data || []);
}
async function loadCardReport() {
  const { data, error } = await sb.rpc('get_card_report');
  state.cardReport = error ? [] : (data || []);
}
async function loadPartnerTeaser() {
  const { data, error } = await sb.rpc('get_partner_teaser');
  state.partnerTeaser = error ? [] : (data || []);
}
async function loadDares() {
  const { data } = await sb.from('dares').select('*').order('created_at', { ascending: false });
  state.dares = data || [];
}
async function loadScoreboard() {
  const { data } = await sb.rpc('get_scoreboard');
  state.scoreboard = data || [];
}
async function loadHeat() {
  const { data } = await sb.from('heat_meter').select('progress').eq('couple_id', state.coupleId).maybeSingle();
  state.heat = data ? data.progress : 0;
}
async function loadRewards() {
  const { data } = await sb.from('rewards').select('*').order('created_at', { ascending: false });
  state.rewards = data || [];
}
async function loadNotifications() {
  const { data } = await sb.from('notifications').select('*').eq('read', false).order('created_at', { ascending: false });
  state.notifications = data || [];
}

let realtimeChannel = null;
function subscribeRealtime() {
  if (realtimeChannel) return;
  realtimeChannel = sb.channel('couple-' + state.coupleId)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'dares', filter: `couple_id=eq.${state.coupleId}` },
      () => { loadDares(); loadScoreboard(); loadHeat(); render(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'notifications', filter: `couple_id=eq.${state.coupleId}` },
      () => { loadNotifications(); render(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rewards', filter: `couple_id=eq.${state.coupleId}` },
      () => { loadRewards(); render(); })
    .subscribe();
}

/* ==========================================================================
   RENDER ROOT
   ========================================================================== */
function getOrderedQuestions() {
  // Walks headings in their display order, and within each heading, cards
  // in their own order.
  const ordered = [];
  state.categories.forEach(c => {
    state.questions
      .filter(q => q.category === c.name)
      .sort((a, b) => a.sort_order - b.sort_order)
      .forEach(q => ordered.push(q));
  });
  return ordered;
}

function getWizardQuestions() {
  // The guided wizard only covers the one general "where do you sit on
  // this heading" question per heading — not every specific card. Specific
  // cards are answered later, by choice, when browsing a heading directly.
  return getOrderedQuestions().filter(q => q.is_general);
}

// Renders the heart-to-freezing gauge used for general "where do you sit"
// questions, or the plain button list used for specific cards. `attrs` is
// the data-* attribute string each stop gets, so the caller's existing
// click handler (wizard or deck view) keeps working unchanged — only the
// visual markup differs.
function renderAnswerControl(q, currentAnswer, attrsFor) {
  if (!q.is_general) {
    return `
      <div class="deck-answers">
        ${ANSWER_ORDER.map(a => `
          <button class="deck-answer-btn ${currentAnswer===a?'selected':''}" ${attrsFor(a)}>${ANSWER_LABELS[a]}</button>
        `).join('')}
      </div>
    `;
  }
  return `
    <div class="answer-gauge">
      <div class="gauge-track"></div>
      <div class="gauge-row">
        ${GAUGE_ORDER.map(a => `
          <button class="gauge-stop ${currentAnswer===a?'selected':''}" ${attrsFor(a)}>${GAUGE_ICONS[a]}</button>
        `).join('')}
      </div>
    </div>
  `;
}

function renderPartnerTeaser() {
  const partnerName = state.partner ? state.partner.display_name : 'Your partner';
  const total = getWizardQuestions().length;
  return `
    <div class="screen" style="padding-top:22px">
      <div class="auth-hero">
        <h1>${esc(partnerName)} already started and is waiting for you</h1>
        <p>Answer the same ${total} questions. Your answers merge into one shared report — nobody sees the other's individual answers, only the joint result.</p>
      </div>
      <div class="teaser-grid">
        ${state.partnerTeaser.map(t => `<div class="teaser-block ${t.answer}"></div>`).join('')}
      </div>
      <div class="teaser-legend">
        ${ANSWER_ORDER.map(a => `
          <div class="teaser-legend-item"><span class="teaser-legend-swatch" style="background:${{full_spark:'#C24C63',warming_up:'#D9A65C',blushing_yes:'#A8A196',just_for_you:'#7FAAC7',cold_card:'#3D6690'}[a]}"></span>${ANSWER_LABELS[a]}</div>
        `).join('')}
      </div>
      <p class="hint-text" style="margin-top:-10px; margin-bottom:20px">These are ${esc(partnerName)}'s answers, shuffled — which one belongs to which question stays hidden until you've answered too.</p>
      <div class="privacy-note">
        <div class="title">Your answers stay private</div>
        <div class="body">${esc(partnerName)} only ever sees the joint result once you've both answered, never your individual answers.</div>
      </div>
      <button class="btn btn-gold" id="btn-teaser-start" style="width:100%">Let's start</button>
    </div>
  `;
}
function attachPartnerTeaserHandlers() {
  const btn = document.getElementById('btn-teaser-start');
  if (btn) btn.onclick = () => { state.viewedTeaser = true; render(); };
}

function renderWizard(q, remaining) {
  if (q.image_path && !state.imageUrls[q.image_path]) fetchSignedImageUrl(q.image_path);
  const imgUrl = q.image_path ? state.imageUrls[q.image_path] : null;
  const totalGeneral = getWizardQuestions().length;
  const answeredGeneral = totalGeneral - remaining;

  return `
    <div class="screen" style="padding-top:22px">
      <div class="deck-progress">${answeredGeneral + 1} of ${totalGeneral} — a general sense of each heading</div>
      <div class="deck-card">
        ${imgUrl ? `<img src="${esc(imgUrl)}" alt="">` : ''}
        <div class="deck-card-body">
          <div class="hint-text" style="margin-bottom:6px">${esc(q.category)}</div>
          <div class="deck-card-title">${esc(q.title)}</div>
          ${q.explanation ? `<div class="deck-card-explain">${esc(q.explanation)}</div>` : ''}
          ${renderAnswerControl(q, null, (a) => `data-wizard-answer="${a}"`)}
        </div>
      </div>
      <button class="link-btn" id="btn-wizard-skip" style="margin-top:14px">Skip for now, come back to this later</button>
      ${remaining > 1 ? `<p class="hint-text" style="margin-top:6px">${remaining - 1} more after this one.</p>` : ''}
    </div>
  `;
}

function attachWizardHandlers(q) {
  $app.querySelectorAll('[data-wizard-answer]').forEach(el => el.onclick = async () => {
    const val = el.dataset.wizardAnswer;
    state.answers[q.id] = val;
    render();
    await sb.from('boundary_answers').upsert({ user_id: state.session.user.id, question_id: q.id, answer: val, updated_at: new Date().toISOString() }, { onConflict: 'user_id,question_id' });
    await loadBoundary(); await loadHeadingAccess(); await loadCardReport();
    render();
  });
  const skipBtn = document.getElementById('btn-wizard-skip');
  if (skipBtn) skipBtn.onclick = () => { state.wizardSkipped.add(q.id); render(); };
}

function render() {
  if (state.loading) { $app.innerHTML = `<div class="loading">Opening… <span style="opacity:0.5">(build ${APP_VERSION})</span></div>`; return; }
  if (!state.session) { $app.innerHTML = renderAuth(); attachAuthHandlers(); return; }
  if (!state.profile) { $app.innerHTML = renderCreateProfile(); attachCreateProfileHandlers(); return; }
  if (!state.profile.gender) { $app.innerHTML = renderChooseTheme(); attachChooseThemeHandlers(); return; }
  if (!state.coupleId) { $app.innerHTML = renderPairing(); attachPairingHandlers(); return; }
  if (!state.partner) { $app.innerHTML = renderAwaitingPartner(); attachAwaitingPartnerHandlers(); return; }

  const wizardQueue = getWizardQuestions().filter(q => !state.answers[q.id] && !state.wizardSkipped.has(q.id));
  if (wizardQueue.length > 0 && state.partnerTeaser.length > 0 && !state.viewedTeaser) {
    $app.innerHTML = renderPartnerTeaser(); attachPartnerTeaserHandlers(); return;
  }
  if (wizardQueue.length > 0) { $app.innerHTML = renderWizard(wizardQueue[0], wizardQueue.length); attachWizardHandlers(wizardQueue[0]); return; }

  const unanswered = getWizardQuestions().filter(q => !state.answers[q.id]).length;

  let body = '';
  if (state.tab === 'home') body = renderHome(unanswered);
  else if (state.tab === 'dares') body = renderDaresTab();
  else if (state.tab === 'boundaries') body = renderBoundariesTab(unanswered);
  else if (state.tab === 'rewards') body = renderRewardsTab();
  else if (state.tab === 'history') body = renderHistoryTab();

  $app.innerHTML = `
    <div class="topbar">
      <div class="wordmark">Moves</div>
      <div class="version" id="version-tap" style="text-decoration:underline; text-underline-offset:2px; cursor:pointer">v${APP_VERSION}</div>
    </div>
    <div class="screen">${body}</div>
    ${renderTabbar()}
    ${state.toast ? `<div class="toast">${esc(state.toast)}</div>` : ''}
    ${state.modal || ''}
  `;
  attachMainHandlers();
}

function renderAuth() {
  return `
    <div class="center-screen">
      <div class="auth-hero">
        <h1>Moves</h1>
        <p>A private, two-player game. Just for the two of you.</p>
      </div>
      <div class="auth-tabs">
        <button class="auth-tab ${state.authMode==='signin'?'active':''}" data-authmode="signin">Sign in</button>
        <button class="auth-tab ${state.authMode==='signup'?'active':''}" data-authmode="signup">Create account</button>
      </div>
      <form id="auth-form" class="stack">
        ${state.authMode==='signup' ? `
        <div class="field"><label>Your name</label><input type="text" id="auth-name" placeholder="How your partner will see you" required></div>
        <div class="field"><label>Theme</label>
          <select id="auth-gender">
            <option value="female">Lighter, warmer theme</option>
            <option value="male">Lighter, cooler theme</option>
          </select>
        </div>` : ''}
        <div class="field"><label>Email</label><input type="email" id="auth-email" required></div>
        <div class="field"><label>Password</label><input type="password" id="auth-password" minlength="8" required></div>
        ${state.authError ? `<div class="error-text">${esc(state.authError)}</div>` : ''}
        <button type="submit" class="btn btn-primary">${state.authMode==='signin' ? 'Sign in' : 'Create account'}</button>
      </form>
    </div>
  `;
}
function attachAuthHandlers() {
  $app.querySelectorAll('[data-authmode]').forEach(b => b.onclick = () => {
    state.authMode = b.dataset.authmode; state.authError = ''; render();
  });
  const form = document.getElementById('auth-form');
  if (form) form.onsubmit = async (e) => {
    e.preventDefault();
    state.authError = '';
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    try {
      if (state.authMode === 'signup') {
        const name = document.getElementById('auth-name').value.trim();
        const gender = document.getElementById('auth-gender').value;
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        if (data.user) {
          await sb.from('profiles').insert({ id: data.user.id, display_name: name || email.split('@')[0], gender });
        }
        state.session = data.session;
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        state.session = data.session;
      }
      await loadEverything();
    } catch (err) {
      state.authError = err.message || 'Something went wrong.';
      render();
    }
  };
}

/* ==========================================================================
   HOME TAB
   ========================================================================== */
function renderHome(unanswered) {
  const pendingForMe = state.dares.filter(d => d.recipient_id === state.session.user.id && d.status === 'sent');
  const active = state.dares.filter(d => ['accepted','in_progress','countered'].includes(d.status));
  const recent = state.dares.filter(d => ['completed','completed_proof','completed_face_to_face'].includes(d.status)).slice(0, 3);

  let statusValue, statusClass = '';
  if (unanswered > 0) { statusValue = `${unanswered} boundary question${unanswered===1?'':'s'} still to answer`; statusClass='awaiting'; }
  else if (pendingForMe.length) { statusValue = `${pendingForMe.length} move${pendingForMe.length===1?'':'s'} waiting on you`; statusClass='awaiting'; }
  else { statusValue = "You're all caught up"; }

  const nextReward = state.rewards.find(r => !r.completed && r.heat_threshold && r.heat_threshold > state.heat);

  return `
    <div class="status-strip">
      <div class="status-label">Status</div>
      <div class="status-value ${statusClass}">${esc(statusValue)}</div>
    </div>

    ${renderScoreboard()}
    ${renderHeatBlock(nextReward)}

    <button class="btn btn-gold" data-nav="create-dare" style="margin-bottom:22px">Create a move</button>

    <div class="section-head"><h2>New for you</h2></div>
    ${pendingForMe.length ? pendingForMe.map(d => renderDareCard(d, true)).join('') : `<div class="empty-state">Nothing new right now.</div>`}

    <div class="section-head"><h2>In play</h2></div>
    ${active.length ? active.map(d => renderDareCard(d, false)).join('') : `<div class="empty-state">No active moves.</div>`}

    <div class="section-head"><h2>Recent</h2><button class="see-all" data-tab="history">See all</button></div>
    ${recent.length ? recent.map(d => renderDareCard(d, false, true)).join('') : `<div class="empty-state">Nothing completed yet.</div>`}
  `;
}

function renderScoreboard() {
  if (!state.scoreboard.length) return '';
  const mine = state.scoreboard.find(s => s.user_id === state.session.user.id);
  const theirs = state.scoreboard.find(s => s.user_id !== state.session.user.id);
  const leadMine = mine && theirs && mine.score > theirs.score;
  const leadTheirs = mine && theirs && theirs.score > mine.score;
  return `
    <div class="scoreboard">
      <div class="score-card ${leadMine?'leading':''}"><div class="name">${esc(mine ? state.profile.display_name : '')}</div><div class="points">${mine ? mine.score : 0}</div></div>
      <div class="score-card ${leadTheirs?'leading':''}"><div class="name">${esc(state.partner ? state.partner.display_name : 'Partner')}</div><div class="points">${theirs ? theirs.score : 0}</div></div>
    </div>
  `;
}

function renderHeatBlock(nextReward) {
  return `
    <div class="heat-block">
      <div class="heat-head"><span class="label">Heat Meter</span><span class="pct">${state.heat}%</span></div>
      <div class="heat-track"><div class="heat-fill" style="width:${state.heat}%"></div></div>
      <div class="heat-next">${nextReward ? `Next: ${esc(nextReward.title)} at ${nextReward.heat_threshold}%` : (state.heat >= 100 ? 'Fully unlocked' : 'Keep playing to build anticipation')}</div>
    </div>
  `;
}

/* ==========================================================================
   DARE CARD
   ========================================================================== */
function renderDareCard(d, actionable, compact) {
  const isMine = d.creator_id === state.session.user.id;
  const isRecipient = d.recipient_id === state.session.user.id;
  const revealed = isMine || d.status !== 'sent'; // sender always sees own; recipient must accept/reveal first for "sent"
  const canReveal = isRecipient && d.status === 'sent';

  let body;
  if (revealed && !canReveal) {
    body = `<div class="dare-instructions">${esc(d.instructions)}</div>`;
  } else {
    body = `<div class="dare-body">${d.teaser ? esc(d.teaser) : 'Details hidden until you reveal it.'}</div>`;
  }

  let actions = '';
  if (actionable && d.status === 'sent' && isRecipient) {
    actions = `
      <div class="btn-row" style="margin-top:4px">
        <button class="btn btn-primary btn-small" data-dare-action="accept" data-dare-id="${d.id}">Accept</button>
        <button class="btn btn-ghost btn-small" data-dare-action="decline" data-dare-id="${d.id}">Decline</button>
        <button class="btn btn-ghost btn-small" data-dare-action="counter" data-dare-id="${d.id}">Counter</button>
      </div>`;
  } else if (['accepted','in_progress','countered'].includes(d.status) && isRecipient) {
    actions = `<div class="btn-row" style="margin-top:4px">
      <button class="btn btn-primary btn-small" data-dare-action="complete" data-dare-id="${d.id}">Mark complete</button>
    </div>`;
  } else if (d.status === 'countered' && isMine) {
    actions = `<div class="hint-text" style="margin-top:6px">They countered — check the updated details above.</div>`;
  }

  return `
    <div class="dare ${d.status==='sent' && !isMine ? 'locked' : 'unlocked'}">
      <div class="dare-top">
        <div class="dare-title">${esc(d.title)}</div>
        ${d.points_awarded != null ? `<div class="dare-points">${d.points_awarded} pts</div>` : ''}
      </div>
      <div class="dare-meta">
        <span class="pill">${TYPE_LABELS[d.dare_type]}</span>
        <span class="pill intensity-${d.intensity}">${INTENSITY_LABELS[d.intensity]}</span>
        <span class="pill">${d.status.replace(/_/g,' ')}</span>
        ${d.deadline ? `<span class="pill">by ${fmtDate(d.deadline)}</span>` : ''}
      </div>
      ${compact ? '' : body}
      ${actions}
    </div>
  `;
}

/* ==========================================================================
   DARES TAB
   ========================================================================== */
function renderDaresTab() {
  const sent = state.dares.filter(d => d.creator_id === state.session.user.id);
  const received = state.dares.filter(d => d.recipient_id === state.session.user.id);
  return `
    <button class="btn btn-gold" data-nav="create-dare" style="margin-bottom:22px">Create a move</button>
    <div class="section-head"><h2>Sent by you</h2></div>
    ${sent.length ? sent.map(d => renderDareCard(d, false)).join('') : `<div class="empty-state">None yet.</div>`}
    <div class="section-head"><h2>Sent to you</h2></div>
    ${received.length ? received.map(d => renderDareCard(d, true)).join('') : `<div class="empty-state">None yet.</div>`}
  `;
}

/* ==========================================================================
   BOUNDARIES TAB

const TIER_LABELS = {
  favorites: 'Perfect Match',
  strong_interest: 'Good Match',
  worth_trying: 'Getting Warmer',
  if_both_up_for_it: 'Worth A Try'
};
const TIER_ORDER = ['favorites', 'strong_interest', 'worth_trying', 'if_both_up_for_it'];

const ACCESS_LABELS = {
  pending: 'Waiting on both of you to answer',
  off_table: 'Not on the table',
  ...TIER_LABELS
};
const ACCESS_CLASSES = {
  pending: '',
  off_table: 'intensity-wild',
  favorites: 'access-full',
  strong_interest: 'intensity-bold',
  worth_trying: 'intensity-tease',
  if_both_up_for_it: 'intensity-risque'
};

function renderOverallStanding() {
  if (!state.headingAccess.length) return '';
  const counts = {};
  state.headingAccess.forEach(h => { counts[h.access] = (counts[h.access] || 0) + 1; });
  const order = ['favorites', 'strong_interest', 'worth_trying', 'if_both_up_for_it', 'off_table', 'pending'];
  const parts = order.filter(a => counts[a]).map(a => `${counts[a]} ${esc(ACCESS_LABELS[a])}`);
  return `
    <div class="status-strip" style="margin-bottom:18px">
      <div class="status-label">Overall, across all ${state.headingAccess.length} headings</div>
      <div class="status-value">${parts.join(' · ')}</div>
    </div>
  `;
}

function renderHeadingAccessList() {
  if (!state.headingAccess.length) return `<div class="empty-state">Answer the 6 general questions to see this.</div>`;
  return state.headingAccess.map(h => {
    const expanded = state.expandedHeadings.has(h.category);
    return `
    <div class="boundary-row" data-toggle-heading="${esc(h.category)}" style="cursor:pointer">
      <div class="cat">${esc(h.category)}<div class="hint-text">${h.answered_count} question${h.answered_count===1?'':'s'} counted</div></div>
      <span class="pill ${ACCESS_CLASSES[h.access]}">${esc(ACCESS_LABELS[h.access])}</span>
      <span class="hint-text" style="margin-left:8px">${expanded ? '▲' : '▼'}</span>
    </div>
    ${expanded ? renderHeadingExpansion(h.category) : ''}
  `;
  }).join('');
}

function renderScoredCardRow(c, showCategory) {
  return `
    <div class="boundary-row">
      <div class="cat" style="font-size:13.5px">${esc(c.title)}${showCategory ? ` <span class="hint-text">— ${esc(c.category)}</span>` : ''}</div>
      <span class="pill ${ACCESS_CLASSES[c.tier]}">${esc(TIER_LABELS[c.tier])}</span>
    </div>
  `;
}

function renderHeadingExpansion(category) {
  const items = state.cardReport.filter(c => c.category === category);
  const offTableCount = items.filter(c => c.tier === 'off_table').length;
  const shown = items.filter(c => c.tier !== 'off_table')
    .sort((a, b) => TIER_ORDER.indexOf(a.tier) - TIER_ORDER.indexOf(b.tier));

  if (!items.length) {
    return `<div class="empty-state" style="padding:10px 0">Nothing answered by both of you in this heading yet.</div>`;
  }

  return `
    <div style="padding:4px 0 10px 0">
      ${shown.map(c => renderScoredCardRow(c, false)).join('')}
      ${offTableCount ? `<p class="hint-text" style="margin-top:8px">${offTableCount} other question${offTableCount===1?'':'s'} answered here ${offTableCount===1?"isn't":"aren't"} on the table — not listed, since who said no isn't shown either.</p>` : ''}
    </div>
  `;
}

function renderCardReport() {
  const offTableCount = state.cardReport.filter(c => c.tier === 'off_table').length;
  const shown = state.cardReport.filter(c => c.tier !== 'off_table')
    .sort((a, b) => TIER_ORDER.indexOf(a.tier) - TIER_ORDER.indexOf(b.tier));

  if (!shown.length && !offTableCount) {
    return `<div class="empty-state">Neither of you has answered a specific card yet — head into Setup to start on a heading.</div>`;
  }

  return `
    ${shown.map(c => renderScoredCardRow(c, true)).join('')}
    ${offTableCount ? `<p class="hint-text" style="margin-top:14px">${offTableCount} other card${offTableCount===1?'':'s'} you've both answered ${offTableCount===1?"isn't":"aren't"} currently on the table — not listed here, since who said no isn't shown either.</p>` : ''}
  `;
}

function renderAllAnswers() {
  const answered = getOrderedQuestions().filter(q => state.answers[q.id]);
  const filterText = state.allAnswersFilter.trim().toLowerCase();
  const filtered = filterText
    ? answered.filter(q => q.title.toLowerCase().includes(filterText) || q.category.toLowerCase().includes(filterText))
    : answered;

  let lastCategory = null;

  return `
    <button class="link-btn" id="btn-close-all-answers">‹ Back to your report</button>
    <div class="section-head" style="margin-top:14px"><h2>All your answers (${answered.length})</h2></div>
    <p class="hint-text" style="margin-bottom:14px">Every question you've personally answered, across every heading. Change any of them right here.</p>
    <div class="field" style="margin-bottom:14px"><input type="text" id="all-answers-search" placeholder="Search by title or heading…" value="${esc(state.allAnswersFilter)}"></div>
    ${filtered.length ? filtered.map(q => {
      const headerHtml = q.category !== lastCategory ? `<div class="hint-text" style="margin:16px 0 6px; font-weight:600; color:var(--text)">${esc(q.category)}</div>` : '';
      lastCategory = q.category;
      return `
        ${headerHtml}
        <div style="margin-bottom:14px">
          <div class="cat" style="margin-bottom:4px; font-size:13.5px">${esc(q.title)}${q.is_general ? ' <span class="pill" style="margin-left:6px">General</span>' : ''}</div>
          ${renderAnswerControl(q, state.answers[q.id], (a) => `data-answer-q="${q.id}" data-answer-v="${a}"`)}
        </div>
      `;
    }).join('') : `<div class="empty-state">No answers match "${esc(state.allAnswersFilter)}".</div>`}
  `;
}

function renderBoundariesTab(unanswered) {
  if (state.viewingSetup) return renderSetupArea();
  if (state.viewingAllAnswers) return renderAllAnswers();

  const generalQuestions = getWizardQuestions();
  const partnerName = state.partner ? state.partner.display_name : 'your partner';

  return `
    <div class="section-head" style="margin-top:0"><h2>Your answers</h2></div>
    <p class="hint-text" style="margin-bottom:14px">Change any of these any time — you don't need to wait for ${esc(partnerName)}, and changing yours never shows ${esc(partnerName)} which way you moved it, only the mutual result below.</p>
    ${generalQuestions.map(q => `
      <div style="margin-bottom:18px">
        <div class="cat" style="margin-bottom:4px">${esc(q.category)}</div>
        ${renderAnswerControl(q, state.answers[q.id], (a) => `data-answer-q="${q.id}" data-answer-v="${a}"`)}
      </div>
    `).join('')}

    <div class="divider"></div>
    <div class="section-head"><h2>Heading access</h2></div>
    <p class="hint-text" style="margin-bottom:14px">A running average across every question you've both answered in that heading — the general one plus any specific cards. Each card keeps its own score regardless; this is just the heading-level picture. The more you've both answered, the less any single new answer shifts it — except a genuine Cold Card answer, which always closes the whole heading, average or not.</p>
    ${renderOverallStanding()}
    ${renderHeadingAccessList()}

    <div class="divider"></div>
    <button class="btn btn-ghost" id="btn-review-answers" style="width:100%; margin-bottom:8px">Review & edit all your answers →</button>
    <button class="btn btn-ghost" id="btn-open-setup" style="width:100%">${state.profile && state.profile.is_admin ? 'Manage headings, cards & content →' : 'Browse headings & answer cards →'}</button>
  `;
}

function renderSetupArea() {
  if (state.openCategory) return renderDeckView();

  const isAdmin = state.profile && state.profile.is_admin;
  const countByCategory = {};
  state.questions.forEach(q => { countByCategory[q.category] = (countByCategory[q.category] || 0) + 1; });
  const answeredByCategory = {};
  state.questions.forEach(q => {
    if (state.answers[q.id]) answeredByCategory[q.category] = (answeredByCategory[q.category] || 0) + 1;
  });

  return `
    <button class="link-btn" id="btn-close-setup">‹ Back to your report</button>
    <div class="section-head" style="margin-top:14px"><h2>Headings</h2></div>
    <p class="hint-text" style="margin-bottom:14px">${isAdmin
      ? 'Tap a heading to go through its cards, add new ones, or attach images. Only you see your own answers — your partner only ever sees the mutual result on your report.'
      : 'Tap a heading to go through its cards and answer them. Only you see your own answers — your partner only ever sees the mutual result on your report.'}</p>

    ${state.categories.map(c => {
      const total = countByCategory[c.name] || 0;
      const answered = answeredByCategory[c.name] || 0;
      return `
        <div class="category-row" data-open-category="${esc(c.name)}">
          <div>
            <div class="cat-name">${esc(c.name)}</div>
            <div class="cat-count">${total} card${total===1?'':'s'}${total ? ` · ${answered} answered` : ' · none yet'}</div>
          </div>
          <div class="cat-arrow">›</div>
        </div>
      `;
    }).join('')}

    ${isAdmin ? `
    <div class="btn-row" style="margin-top:14px">
      <button class="btn btn-ghost" id="btn-new-heading">Add a new heading</button>
      <button class="btn btn-ghost" id="btn-import-csv">Import from CSV</button>
    </div>
    ${state.questions.length ? `<button class="btn btn-ghost" id="btn-bulk-images" style="margin-top:8px; width:100%">Attach images to cards</button>` : ''}
    ${state.questions.length ? `<button class="link-btn" id="btn-delete-all-cards" style="margin-top:14px; color:var(--wine-bright)">Delete all ${state.questions.length} cards across every heading</button>` : ''}

    <div class="divider"></div>
    <div class="section-head"><h2>Your card report</h2></div>
    <p class="hint-text" style="margin-bottom:6px">Admin-only — for specific cards you've both answered, grouped by how well matched you are.</p>
    ${renderCardReport()}
    ` : ''}
  `;
}

function renderDeckView() {
  const cards = state.questions.filter(q => q.category === state.openCategory);

  const modeToggle = `
    <div class="btn-row" style="margin:14px 0">
      <button class="btn ${state.deckViewMode==='card'?'btn-primary':'btn-ghost'} btn-small" data-deck-mode="card">One at a time</button>
      <button class="btn ${state.deckViewMode==='list'?'btn-primary':'btn-ghost'} btn-small" data-deck-mode="list">List view</button>
    </div>
  `;

  if (cards.length === 0) {
    const isAdmin = state.profile && state.profile.is_admin;
    return `
      <button class="link-btn" data-close-deck="1">‹ Back to headings</button>
      <div class="auth-hero" style="margin-top:20px"><h1>${esc(state.openCategory)}</h1><p>No cards here yet.</p></div>
      ${isAdmin ? `<button class="btn btn-gold" id="btn-add-card">Add the first card</button>` : ''}
    `;
  }

  if (state.deckViewMode === 'list') return renderDeckListView(cards, modeToggle);
  return renderDeckCardView(cards, modeToggle);
}

function renderDeckListView(cards, modeToggle) {
  const filterText = state.deckFilter.trim().toLowerCase();
  const filtered = filterText ? cards.filter(q => q.title.toLowerCase().includes(filterText)) : cards;

  return `
    <button class="link-btn" data-close-deck="1">‹ Back to headings</button>
    ${modeToggle}
    <div class="field" style="margin-bottom:14px"><input type="text" id="deck-search" placeholder="Search ${esc(state.openCategory)}…" value="${esc(state.deckFilter)}"></div>
    ${filtered.length ? filtered.map((q, i) => {
      const realIdx = cards.indexOf(q);
      const answer = state.answers[q.id];
      return `
        <div class="category-row" data-open-card="${realIdx}" style="cursor:pointer">
          <div>
            <div class="cat-name" style="font-size:14.5px">${esc(q.title)}</div>
            <div class="cat-count">
              <span class="pill intensity-${q.max_intensity}" style="margin-right:6px">${INTENSITY_LABELS[q.max_intensity]}</span>
              ${answer ? esc(ANSWER_LABELS[answer]) : 'Not answered yet'}
            </div>
          </div>
          <div class="cat-arrow">›</div>
        </div>
      `;
    }).join('') : `<div class="empty-state">No cards match "${esc(state.deckFilter)}".</div>`}
    ${state.profile && state.profile.is_admin ? `<button class="link-btn" data-delete-all-heading="${esc(state.openCategory)}" style="margin-top:14px; color:var(--wine-bright)">Delete all ${cards.length} cards in "${esc(state.openCategory)}"</button>` : ''}
  `;
}

function renderDeckCardView(cards, modeToggle) {
  const idx = Math.min(state.deckIndex, Math.max(0, cards.length - 1));
  const q = cards[idx];
  const isAdmin = state.profile && state.profile.is_admin;

  if (q.image_path && !state.imageUrls[q.image_path]) {
    fetchSignedImageUrl(q.image_path);
  }
  const imgUrl = q.image_path ? state.imageUrls[q.image_path] : null;

  return `
    <button class="link-btn" data-close-deck="1">‹ Back to headings</button>
    ${modeToggle}
    <div class="deck-progress">${esc(state.openCategory)} — card ${idx + 1} of ${cards.length}</div>
    <div class="deck-card">
      ${imgUrl ? `<img src="${esc(imgUrl)}" alt="">` : ''}
      <div class="deck-card-body">
        <div class="deck-card-title">${esc(q.title)}${q.is_general ? ' <span class="pill" style="margin-left:6px">General</span>' : ''}</div>
        ${q.explanation ? `<div class="deck-card-explain">${esc(q.explanation)}</div>` : ''}
        ${renderAnswerControl(q, state.answers[q.id], (a) => `data-answer-q="${q.id}" data-answer-v="${a}"`)}
        ${isAdmin ? `
        <div class="btn-row" style="margin-top:10px">
          <button class="link-btn" data-attach-image="${q.id}">${imgUrl ? 'Replace image' : 'Attach an image'}</button>
          <button class="link-btn" data-delete-card="${q.id}" style="color:var(--wine-bright)">Delete this card</button>
        </div>
        ` : ''}
      </div>
    </div>
    <div class="deck-nav">
      <button data-deck-prev="1" ${idx===0?'disabled':''}>‹ Previous</button>
      ${isAdmin ? `<button id="btn-add-card">+ Add a card here</button>` : '<span></span>'}
      <button data-deck-next="1" ${idx===cards.length-1?'disabled':''}>Next ›</button>
    </div>
    ${isAdmin ? `<button class="link-btn" data-delete-all-heading="${esc(state.openCategory)}" style="margin-top:14px; color:var(--wine-bright)">Delete all ${cards.length} cards in "${esc(state.openCategory)}"</button>` : ''}
  `;
}

async function fetchSignedImageUrl(path) {
  if (state.imageUrls[path] === 'pending') return;
  state.imageUrls[path] = 'pending';
  const { data } = await sb.storage.from('boundary-images').createSignedUrl(path, 3600);
  if (data && data.signedUrl) {
    state.imageUrls[path] = data.signedUrl;
    render();
  }
}


/* ==========================================================================
   REWARDS TAB
   ========================================================================== */
function renderRewardsTab() {
  return `
    <button class="btn btn-gold" data-nav="create-reward" style="margin-bottom:22px">Add a reward</button>
    ${state.rewards.length ? state.rewards.map(r => `
      <div class="dare ${r.revealed ? 'unlocked' : 'locked'}">
        <div class="dare-top">
          <div class="dare-title">${r.revealed ? esc(r.title) : 'Locked reward'}</div>
          ${r.completed ? `<span class="pill">claimed</span>` : ''}
        </div>
        <div class="dare-body">${r.revealed ? esc(r.details) : (r.teaser ? esc(r.teaser) : 'Keep playing to reveal this.')}</div>
        <div class="hint-text">${esc(r.unlock_condition)}</div>
        ${(!r.completed && r.revealed) ? `<div class="btn-row" style="margin-top:10px"><button class="btn btn-ghost btn-small" data-reward-complete="${r.id}">Mark claimed</button></div>` : ''}
      </div>
    `).join('') : `<div class="empty-state">No rewards set up yet.</div>`}
  `;
}

/* ==========================================================================
   HISTORY TAB
   ========================================================================== */
function renderHistoryTab() {
  const done = state.dares.filter(d => !['sent'].includes(d.status));
  return `
    <div class="section-head"><h2>All activity</h2></div>
    ${done.length ? done.map(d => renderDareCard(d, false, true)).join('') : `<div class="empty-state">Nothing yet.</div>`}
  `;
}

/* ==========================================================================
   TAB BAR
   ========================================================================== */
function renderTabbar() {
  const pending = state.dares.filter(d => d.recipient_id === state.session.user.id && d.status === 'sent').length;
  const tabs = [
    ['boundaries','Kinks'], ['home','Home'], ['dares','Moves'], ['rewards','Rewards'], ['history','History']
  ];
  return `<div class="tabbar">
    ${tabs.map(([id,label]) => `
      <button class="tab ${state.tab===id?'active':''}" data-tab="${id}" style="position:relative">
        ${label}${id==='dares' && pending ? '<span class="dot"></span>' : ''}
      </button>
    `).join('')}
  </div>`;
}

/* ==========================================================================
   MODALS: create dare / create reward / counter
   ========================================================================== */
function openCreateDareModal() {
  const eligible = state.boundary.filter(b => b.permitted);
  state.modal = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal-sheet">
        <h2>Create a move</h2>
        ${eligible.length === 0 ? `<p class="hint-text">No shared boundary categories yet — answer more questions together first.</p>` : `
        <form id="dare-form" class="stack">
          <div class="field"><label>Category</label>
            <select id="d-question">
              ${eligible.map(b => `<option value="${b.question_id}" data-cap="${b.intensity_cap||''}">${esc(b.title)}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Title</label><input type="text" id="d-title" required></div>
          <div class="field"><label>Teaser (shown before they reveal it)</label><input type="text" id="d-teaser"></div>
          <div class="field"><label>Full instructions</label><textarea id="d-instructions" required></textarea></div>
          <div class="field"><label>Type</label>
            <select id="d-type">${Object.keys(TYPE_LABELS).map(t => `<option value="${t}">${TYPE_LABELS[t]}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Intensity</label>
            <select id="d-intensity">${Object.keys(INTENSITY_LABELS).map(i => `<option value="${i}">${INTENSITY_LABELS[i]} — ${INTENSITY_POINTS[i]} pts</option>`).join('')}</select>
          </div>
          <div class="field"><label>Deadline (optional)</label><input type="datetime-local" id="d-deadline"></div>
          <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-dim)">
            <input type="checkbox" id="d-confirm" style="width:auto"> Requires my confirmation to count as complete
          </label>
          <div id="dare-form-error" class="error-text"></div>
          <div class="btn-row">
            <button type="button" class="btn btn-ghost" id="modal-cancel">Cancel</button>
            <button type="submit" class="btn btn-primary">Send</button>
          </div>
        </form>`}
        ${eligible.length === 0 ? `<button class="btn btn-ghost" id="modal-cancel" style="margin-top:16px">Close</button>` : ''}
      </div>
    </div>
  `;
  render();
  document.getElementById('modal-cancel').onclick = closeModal;
  const form = document.getElementById('dare-form');
  if (form) form.onsubmit = async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('dare-form-error');
    const deadlineVal = document.getElementById('d-deadline').value;
    const { error } = await sb.rpc('create_dare', {
      p_question_id: document.getElementById('d-question').value,
      p_title: document.getElementById('d-title').value.trim(),
      p_instructions: document.getElementById('d-instructions').value.trim(),
      p_teaser: document.getElementById('d-teaser').value.trim() || null,
      p_dare_type: document.getElementById('d-type').value,
      p_intensity: document.getElementById('d-intensity').value,
      p_deadline: deadlineVal ? new Date(deadlineVal).toISOString() : null,
      p_requires_confirmation: document.getElementById('d-confirm').checked,
      p_reward_text: null,
      p_reusable: false
    });
    if (error) { errEl.textContent = error.message; return; }
    closeModal();
    await loadDares();
    showToast('Move sent.');
  };
}

function openCounterModal(dareId) {
  const d = state.dares.find(x => x.id === dareId);
  if (!d) return;
  state.modal = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal-sheet">
        <h2>Counter this move</h2>
        <form id="counter-form" class="stack">
          <div class="field"><label>Adjusted instructions</label><textarea id="c-instructions">${esc(d.instructions)}</textarea></div>
          <div class="field"><label>Adjusted intensity</label>
            <select id="c-intensity">${Object.keys(INTENSITY_LABELS).map(i => `<option value="${i}" ${i===d.intensity?'selected':''}>${INTENSITY_LABELS[i]}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Adjusted deadline</label><input type="datetime-local" id="c-deadline"></div>
          <div class="btn-row">
            <button type="button" class="btn btn-ghost" id="modal-cancel">Cancel</button>
            <button type="submit" class="btn btn-primary">Send counter</button>
          </div>
        </form>
      </div>
    </div>
  `;
  render();
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('counter-form').onsubmit = async (e) => {
    e.preventDefault();
    const deadlineVal = document.getElementById('c-deadline').value;
    const { error } = await sb.rpc('respond_to_dare', {
      p_dare_id: dareId, p_action: 'counter',
      p_new_deadline: deadlineVal ? new Date(deadlineVal).toISOString() : null,
      p_new_intensity: document.getElementById('c-intensity').value,
      p_new_instructions: document.getElementById('c-instructions').value.trim()
    });
    if (error) { showToast(error.message); return; }
    closeModal();
    await loadDares();
    showToast('Counter sent.');
  };
}

function openCreateRewardModal() {
  state.modal = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal-sheet">
        <h2>Add a reward</h2>
        <form id="reward-form" class="stack">
          <div class="field"><label>Title</label><input type="text" id="r-title" required></div>
          <div class="field"><label>Teaser (shown while locked)</label><input type="text" id="r-teaser"></div>
          <div class="field"><label>Full details (hidden until unlocked)</label><textarea id="r-details" required></textarea></div>
          <div class="field"><label>Unlock condition (in words)</label><input type="text" id="r-condition" placeholder="e.g. Reach 75% on the Heat Meter" required></div>
          <div class="field"><label>Heat Meter threshold to auto-reveal (optional)</label>
            <select id="r-threshold"><option value="">None</option>${HEAT_THRESHOLDS.map(t => `<option value="${t}">${t}%</option>`).join('')}</select>
          </div>
          <div class="btn-row">
            <button type="button" class="btn btn-ghost" id="modal-cancel">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  `;
  render();
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('reward-form').onsubmit = async (e) => {
    e.preventDefault();
    const threshold = document.getElementById('r-threshold').value;
    const { error } = await sb.from('rewards').insert({
      couple_id: state.coupleId,
      creator_id: state.session.user.id,
      title: document.getElementById('r-title').value.trim(),
      teaser: document.getElementById('r-teaser').value.trim() || null,
      details: document.getElementById('r-details').value.trim(),
      unlock_condition: document.getElementById('r-condition').value.trim(),
      heat_threshold: threshold ? parseInt(threshold) : null,

    const { error } = await sb.from('boundary_questions').delete().eq('id', el.dataset.deleteCard);

    await loadQuestions();
    await loadBoundary(); await loadHeadingAccess(); await loadCardReport();
    render();
    showToast('Card deleted.');
  });

  const deleteAllHeadingBtn = document.querySelector('[data-delete-all-heading]');
  if (deleteAllHeadingBtn) deleteAllHeadingBtn.onclick = async () => {
    const cat = deleteAllHeadingBtn.dataset.deleteAllHeading;

    const { error } = await sb.from('boundary_questions').delete().eq('category', cat);

    state.deckIndex = 0;
    await loadQuestions();
    await loadBoundary(); await loadHeadingAccess(); await loadCardReport();

    showToast(`All cards in "${cat}" deleted.`);

    await loadBoundary(); await loadHeadingAccess(); await loadCardReport();

const VALID_TYPES = ['apart', 'together', 'either', 'reunion'];

function normalizeForMatch(s) {
  return s.trim().toLowerCase().replace(/[_-]+/g, ' ').replace(/\s+/g, ' ');
}

async function runBulkImageImport(files) {
  const progressEl = document.getElementById('bulk-image-progress');
  let matched = 0;
  const unmatched = [];

  function stripExt(name) { return name.replace(/\.[^/.]+$/, ''); }

  // Two lookups: by the explicit filename hint set via CSV import (checked
  // first), and by card title (fallback), across every heading.
  const byFilename = {};
  const byTitle = {};
  state.questions.forEach(q => {
    if (q.pending_image_filename) byFilename[normalizeForMatch(stripExt(q.pending_image_filename))] = q;
    byTitle[normalizeForMatch(q.title)] = q;
  });

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    if (progressEl) progressEl.textContent = `Matching image ${i + 1} of ${files.length}…`;
    const key = normalizeForMatch(stripExt(file.name));
    const q = byFilename[key] || byTitle[key];
    if (!q) { unmatched.push(file.name); continue; }

    const ext = file.name.split('.').pop();
    const path = `${state.coupleId}/${crypto.randomUUID()}.${ext}`;
    const { error: uploadError } = await sb.storage.from('boundary-images').upload(path, file);
    if (uploadError) { unmatched.push(`${file.name} (upload failed: ${uploadError.message})`); continue; }

    const { error: updateError } = await sb.from('boundary_questions')
      .update({ image_path: path, pending_image_filename: null }).eq('id', q.id);
    if (updateError) { unmatched.push(`${file.name} (couldn't save: ${updateError.message})`); continue; }

    matched++;
  }

  await loadQuestions();
  if (progressEl) {
    progressEl.innerHTML = `<b>${matched} image${matched===1?'':'s'} attached, ${unmatched.length} unmatched.</b>` +
      (unmatched.length ? `<div style="margin-top:8px; max-height:150px; overflow-y:auto">${unmatched.map(f => `<div>${esc(f)} — no matching filename or title found.</div>`).join('')}</div>` : '');
  }
}

async function runCsvImport(rows) {
  const progressEl = document.getElementById('import-progress');
  // Case-insensitive lookup: normalized name -> the heading's real, correctly-cased name.
  const categoryLookup = {};
  state.categories.forEach(c => { categoryLookup[c.name.trim().toLowerCase()] = c.name; });
  let added = 0, skipped = 0;
  const errors = [];

  // Accepts a small set of likely alternate header names, since imported
  // files won't always use our exact column names or casing.
  function pick(row, ...keys) {
    for (const k of keys) { if (row[k] !== undefined && row[k] !== '') return row[k]; }
    return '';
  }
  // Strips accents (e.g. "Risqué" -> "risque") so values with accented
  // characters still match, regardless of case.
  function normalize(s) {
    return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
  }

  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const lineNum = i + 2; // account for header row, 1-indexed
    const category = pick(row, 'category', 'heading', 'category_heading').trim();
    const title = pick(row, 'title', 'name', 'card_title').trim();
    const explanation = pick(row, 'explanation', 'description', 'details').trim() || null;
    const rawIntensity = pick(row, 'max_intensity', 'intensity');
    const rawSuitable = pick(row, 'suitable_for', 'type', 'dare_type');
    const imageFilename = pick(row, 'image_filename', 'image', 'filename').trim() || null;
    const rawIsGeneral = pick(row, 'is_general', 'general').trim().toLowerCase();
    const isGeneral = ['true', 'yes', '1'].includes(rawIsGeneral);
    let intensity = normalize(rawIntensity);
    let suitable = normalize(rawSuitable);

    if (progressEl) progressEl.textContent = `Importing row ${i + 1} of ${rows.length}…`;

    if (!category || !title) {
      skipped++; errors.push(`Row ${lineNum}: missing category or title — skipped.`); continue;
    }
    if (!VALID_INTENSITIES.includes(intensity)) {
      const looksShifted = rawIntensity.length > 25;
      const hint = looksShifted
        ? ` — this looks like description text, not an intensity level. Check row ${lineNum} in your source file for an un-quoted comma in the description that may have shifted the columns.`
        : '';
      skipped++; errors.push(`Row ${lineNum}: invalid max_intensity "${rawIntensity}"${hint} — skipped.`); continue;
    }
    if (!VALID_TYPES.includes(suitable)) suitable = 'either';

    const categoryKey = category.toLowerCase();
    let resolvedCategory = categoryLookup[categoryKey];
    if (!resolvedCategory) {
      const { error: catErr } = await sb.rpc('add_boundary_category', { p_name: category });
      if (catErr) { skipped++; errors.push(`Row ${lineNum}: couldn't create heading "${category}" — skipped.`); continue; }
      resolvedCategory = category;
      categoryLookup[categoryKey] = category;
    }

    const { data: newId, error } = await sb.rpc('add_boundary_question', {
      p_category: resolvedCategory, p_title: title, p_explanation: explanation, p_image_path: null,
      p_max_intensity: intensity, p_suitable_for: suitable, p_is_general: isGeneral
    });
    if (error) { skipped++; errors.push(`Row ${lineNum}: ${error.message}`); continue; }
    if (imageFilename && newId) {
      await sb.from('boundary_questions').update({ pending_image_filename: imageFilename }).eq('id', newId);
    }
    added++;
  }

  await loadCategories();
  await loadQuestions();
  if (progressEl) {
    progressEl.innerHTML = `<b>${added} card${added===1?'':'s'} added, ${skipped} skipped.</b>` +
      (errors.length ? `<div style="margin-top:8px; max-height:150px; overflow-y:auto">${errors.map(e => `<div>${esc(e)}</div>`).join('')}</div>` : '');
  }
  // Note: intentionally not calling render() here — state.modal is a static
  // snapshot taken when the modal opened, and re-rendering it would wipe out
  // the summary we just wrote directly into the DOM. Categories/questions are
  // already reloaded, so the boundaries list will show fresh counts as soon
  // as the modal is closed.
}

  $app.querySelectorAll('[data-complete-kind]').forEach(el => el.onclick = async () => {
    const { error } = await sb.rpc('complete_dare', { p_dare_id: el.dataset.completeId, p_completion_kind: el.dataset.completeKind });
    if (error) { showToast(error.message); return; }
    closeModal();
    await Promise.all([loadDares(), loadScoreboard(), loadHeat()]);
    showToast('Nice work — points added.');
  });
}

boot();

</script>
</body>
</html>
