<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>TwoPlay</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TwoPlay">
<meta name="theme-color" content="#14100F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
  :root{
    /* Falls back to night mode until the clock-based check runs (applyDayNightMode, called immediately at load) */
    --bg:#3B1A2A;
    --surface:#4D2238;
    --surface-raised:#5A2A42;
    --line:#6B3350;
    --wine:#FF5C8D;
    --wine-bright:#FF7CA3;
    --gold:#E0B563;
    --text:#FDEEF5;
    --text-dim:#F0C9DA;
    --text-faint:#C98BA6;
    --good:#8FB37F;
    --radius-s:6px;
    --radius-m:10px;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  /* Intimate, after-dark — deep plum ground, same pink/gold accents as day */
  body.mode-night{
    --bg:#3B1A2A;
    --surface:#4D2238;
    --surface-raised:#5A2A42;
    --line:#6B3350;
    --wine:#FF5C8D;
    --wine-bright:#FF7CA3;
    --gold:#E0B563;
    --text:#FDEEF5;
    --text-dim:#F0C9DA;
    --text-faint:#C98BA6;
    --good:#8FB37F;
  }
  /* Bright, playful, sun-lit — warm cream ground, same pink/gold accents as night */
  body.mode-day{
    --bg:#FFF1ED;
    --surface:#FFFFFF;
    --surface-raised:#FFFFFF;
    --line:#F2C7CE;
    --wine:#FF5C8D;
    --wine-bright:#D6336C;
    --gold:#D98D2B;
    --text:#3A1B26;
    --text-dim:#7A5568;
    --text-faint:#A9808F;
    --good:#6B9459;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:15px;

    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  h1,h2,h3{font-family:var(--serif); font-weight:500; margin:0;}
  a{color:inherit;}
  button{font-family:var(--sans); cursor:pointer;}
  input,select,textarea{font-family:var(--sans);}
  ::selection{background:var(--wine); color:var(--text);}

  #app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; transition:max-width 0.2s ease;}
  body.admin-wide #app{max-width:900px;}

  .admin-columns{display:grid; grid-template-columns:1fr 1fr; gap:28px;}
  @media (max-width:680px){
    .admin-columns{display:block;}
    .admin-columns > div:first-child{margin-bottom:28px; padding-bottom:28px; border-bottom:1px solid var(--line);}
  }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 14px;
  }
  .topbar .wordmark{font-family:var(--serif); font-size:16px; letter-spacing:0.2px; color:var(--gold); text-align:right;}
  .topbar .version{font-size:10.5px; color:var(--text-faint); text-align:right;}
  .topbar-identity{display:flex; align-items:center; gap:9px; cursor:pointer; background:none; border:none; padding:0;}
  .topbar-avatar{
    width:34px; height:34px; border-radius:50%; flex-shrink:0; overflow:hidden;
    background:var(--surface-raised); border:1.5px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
  }
  .topbar-avatar img{width:100%; height:100%; object-fit:cover;}
  .topbar-avatar .avatar-initial{font-size:14px;}
  .topbar-name{font-family:var(--serif); font-size:15px; color:var(--text);}

  /* ---------- generic layout ---------- */
  .screen{padding:0 20px 100px; flex:1;}
  .center-screen{flex:1; display:flex; flex-direction:column; justify-content:center; padding:20px;}
  .stack{display:flex; flex-direction:column; gap:14px;}
  .field label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:6px;}
  .field input, .field textarea, .field select{
    width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text);
    border-radius:var(--radius-s); padding:11px 12px; font-size:15px;
  }
  .field textarea{resize:vertical; min-height:70px;}
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:2px solid var(--gold); outline-offset:1px; border-color:var(--gold);
  }
  /* Chromium renders the calendar/clock picker icon dark by default,
     which goes invisible against our dark inputs — this is very likely
     why the deadline picker seemed to disappear after the dark redesign. */
  input[type="datetime-local"]::-webkit-calendar-picker-indicator,
  input[type="date"]::-webkit-calendar-picker-indicator,
  input[type="time"]::-webkit-calendar-picker-indicator{
    filter: invert(0.85); cursor: pointer;
  }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:var(--radius-s); padding:12px 18px;
    font-size:14.5px; font-weight:600; width:100%;
  }
  .btn-primary{background:var(--wine); color:#fff;}
  .btn-primary:active{background:var(--wine-bright);}
  .btn-ghost{background:transparent; color:var(--text-dim); border:1px solid var(--line);}
  .btn-gold{background:var(--gold); color:#1B1714;}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{width:auto; flex:1;}
  .btn-small{padding:8px 12px; font-size:13px; width:auto;}
  .btn:disabled{opacity:0.45;}
  .link-btn{background:none; border:none; color:var(--text-dim); text-decoration:underline; font-size:13px; padding:6px 0;}

  .error-text{color:var(--wine-bright); font-size:13px;}
  .hint-text{color:var(--text-faint); font-size:12.5px;}

  .divider{height:1px; background:var(--line); margin:22px 0;}

  /* ---------- auth screen ---------- */
  .auth-hero{margin-bottom:34px;}
  .auth-hero h1{font-size:30px; color:var(--text); margin-bottom:6px;}
  .auth-hero p{color:var(--text-dim); font-size:14px; max-width:34ch;}
  .auth-tabs{display:flex; gap:22px; margin-bottom:20px; border-bottom:1px solid var(--line);}
  .auth-tab{background:none; border:none; color:var(--text-faint); padding:8px 0; font-size:14px; font-weight:600; border-bottom:2px solid transparent;}
  .auth-tab.active{color:var(--gold); border-bottom-color:var(--gold);}

  /* ---------- ready gate (photo-backed door screen before the questions) ---------- */
  .ready-door-screen{position:relative; width:100%; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; justify-content:flex-end; background-size:cover; background-position:center;}
  .ready-door-scrim{position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,8,6,0) 40%, rgba(10,8,6,0.55) 72%, rgba(8,6,5,0.94) 100%);}
  .ready-door-content{position:relative; z-index:1; padding:0 24px calc(40px + env(safe-area-inset-bottom)); text-align:center;}
  .ready-door-content p{color:#f1e9dd; margin:0 0 18px; font-size:15px;}
  .ready-gate-title{font-size:42px; text-align:center; margin:0; color:var(--text);}

  /* ---------- pairing ---------- */
  .code-display{
    font-family:var(--serif); font-size:38px; letter-spacing:6px; color:var(--gold);
    text-align:center; padding:26px 0; background:var(--surface); border-radius:var(--radius-m);
    border:1px solid var(--line);
  }

  /* ---------- status banner (home) ---------- */
  .status-strip{
    padding:16px 20px; margin:0 -20px 22px; background:var(--surface);
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  }
  .status-strip .status-label{font-size:11.5px; color:var(--text-faint); margin-bottom:3px;}
  .status-strip .status-value{font-family:var(--serif); font-size:19px; color:var(--text);}
  .status-strip .status-value.awaiting{color:var(--gold);}

  .inplay-hero{
    margin:0 -20px 22px; padding:22px 20px;
    background:linear-gradient(135deg, var(--wine), var(--gold));
    color:#fff; position:relative; overflow:hidden;
  }
  .inplay-hero-label{
    display:flex; align-items:center; gap:8px; font-size:12px; font-weight:800;
    letter-spacing:1.5px; text-transform:uppercase; margin-bottom:8px; opacity:0.95;
  }
  .inplay-hero-dot{width:9px; height:9px; border-radius:50%; background:#fff; animation:pulse-dot 1.4s ease-in-out infinite;}
  .inplay-hero-title{font-family:var(--serif); font-size:24px; font-weight:600; margin-bottom:10px; line-height:1.15;}
  .inplay-hero-countdown{font-family:var(--serif); font-size:38px; font-weight:600; line-height:1;}
  .inplay-hero-countdown.overdue{color:#FFE0E0;}
  .inplay-hero-sub{font-size:12.5px; opacity:0.9; margin-top:4px;}
  .inplay-hero-more{font-size:12px; opacity:0.85; margin-top:10px;}
  .avatar-initial{font-family:var(--serif); font-size:26px; color:var(--gold);}

  /* ---------- scoreboard ---------- */
  .scoreboard{display:flex; gap:12px; margin-bottom:18px;}
  .score-card{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px;}
  .score-card.leading{border-color:var(--gold);}
  .score-card .name{font-size:12px; color:var(--text-dim); margin-bottom:4px;}
  .score-card .points{font-family:var(--serif); font-size:32px; color:var(--text);}
  .score-card .points span{font-size:14px; color:var(--text-faint);}

  /* ---------- heat meter ---------- */
  .heat-block{margin-bottom:22px;}
  .heat-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .heat-head .label{font-size:12px; color:var(--text-dim);}
  .heat-head .pct{font-family:var(--serif); font-size:16px; color:var(--gold);}
  .heat-track{height:8px; background:var(--surface); border-radius:99px; overflow:hidden; border:1px solid var(--line);}
  .heat-fill{height:100%; background:linear-gradient(90deg, var(--wine), var(--gold)); transition:width 0.5s ease;}
  .heat-next{font-size:12px; color:var(--text-faint); margin-top:6px;}

  /* ---------- section headers ---------- */
  .section-head{display:flex; justify-content:space-between; align-items:center; margin:26px 0 12px;}
  .section-head h2{font-size:15px; color:var(--text); font-weight:600; font-family:var(--sans);}
  .section-head .see-all{font-size:12.5px; color:var(--text-faint); background:none; border:none;}

  /* ---------- dare card ---------- */
  .dare{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m);
    padding:16px; margin-bottom:10px; position:relative; overflow:hidden;
  }
  .dare.locked{border-left:3px solid var(--wine);}
  .dare.unlocked{border-left:3px solid var(--gold);}
  .dare.in-play{
    border:2px solid var(--gold); border-left:2px solid var(--gold);
    box-shadow:0 0 0 1px var(--gold) inset, 0 6px 20px rgba(201,169,97,0.18);
    background:linear-gradient(135deg, var(--surface), var(--surface-raised));
  }
  .in-play-banner{
    display:flex; align-items:center; gap:7px; margin-bottom:10px;
    font-size:11.5px; font-weight:700; letter-spacing:0.5px; color:var(--gold); text-transform:uppercase;
  }
  .in-play-dot{width:8px; height:8px; border-radius:50%; background:var(--gold); animation:pulse-dot 1.6s ease-in-out infinite;}
  @keyframes pulse-dot{
    0%,100%{opacity:1; transform:scale(1);}
    50%{opacity:0.4; transform:scale(0.7);}
  }
  .countdown-text{font-size:12.5px; color:var(--gold); font-weight:600; margin-bottom:8px;}
  .countdown-text.overdue{color:var(--wine-bright);}
  .dare-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px;}
  .dare-title{font-family:var(--serif); font-size:17px; color:var(--text);}
  .dare-meta{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .pill{
    font-size:11px; padding:3px 9px; border-radius:99px; border:1px solid var(--line); color:var(--text-dim);
    white-space:nowrap;
  }
  .pill.intensity-tease{background:#243019; color:#A8CC96; border-color:#3D5230;}
  .pill.intensity-risque{background:#332711; color:#E0B368; border-color:#5C4620;}
  .pill.intensity-bold{background:#331F14; color:#E0935E; border-color:#5C3826;}
  .pill.intensity-wild{background:#331319; color:#E07485; border-color:#5C2530;}
  .pill.access-full{background:#332711; color:#E8C878; border-color:#5C4620; font-weight:600;}
  .dare-body{color:var(--text-dim); font-size:13.5px; margin-bottom:12px;}
  .dare-instructions{color:var(--text); font-size:14px; margin-bottom:12px; line-height:1.55;}
  .dare-points{font-size:12px; color:var(--gold);}

  /* ---------- notification / toast ---------- */
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--surface-raised); border:1px solid var(--gold); color:var(--text);
    padding:12px 18px; border-radius:var(--radius-s); font-size:13.5px; max-width:88%;
    box-shadow:0 8px 24px rgba(0,0,0,0.4); z-index:200;
  }

  /* ---------- bottom nav ---------- */
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; background:var(--surface-raised);
    border-top:1px solid var(--line); padding:8px 0 calc(8px + env(safe-area-inset-bottom));
    display:flex; max-width:520px; margin:0 auto;
  }
  .tab{
    flex:1; background:none; border:none; color:var(--text-faint); font-size:11px;
    display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 0;
  }
  .tab.active{color:var(--gold);}
  .tab .dot{width:6px; height:6px; border-radius:50%; background:var(--wine-bright); position:absolute; margin-left:14px; margin-top:-2px;}

  .empty-state{color:var(--text-faint); font-size:13.5px; padding:24px 0; text-align:center;}

  .qa-row{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px; margin-bottom:10px;}
  .qa-cat{font-size:11px; color:var(--text-faint); margin-bottom:4px;}
  .qa-title{font-size:14.5px; color:var(--text); margin-bottom:3px;}
  .qa-explain{font-size:12.5px; color:var(--text-dim); margin-bottom:12px;}
  .qa-options{display:flex; gap:6px; flex-wrap:wrap;}
  .qa-opt{
    background:var(--bg); border:1px solid var(--line); color:var(--text-dim);
    padding:7px 11px; border-radius:99px; font-size:12.5px;
  }
  .qa-opt.selected{background:var(--gold); color:#1B1714; border-color:var(--gold); font-weight:600;}

  .boundary-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line);}
  .boundary-row:last-child{border-bottom:none;}
  .boundary-row .cat{font-size:14px; color:var(--text);}
  .boundary-row .lvl{font-size:12px; color:var(--text-faint);}
  .boundary-row.excluded{opacity:0.4;}

  .category-row{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m);
    padding:16px; margin-bottom:8px;
  }
  .category-row .cat-name{font-family:var(--serif); font-size:16px; color:var(--text);}
  .category-row .cat-count{font-size:12px; color:var(--text-faint); margin-top:2px;}
  .category-row .cat-arrow{color:var(--text-faint); font-size:18px;}

  .deck-progress{font-size:12px; color:var(--text-faint); text-align:center; margin-bottom:10px;}
  .deck-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m);
    padding:0; margin-bottom:16px; overflow:hidden;
  }
  .deck-card img{width:100%; display:block; aspect-ratio:4/3; object-fit:cover; background:var(--surface-raised);}
  .deck-card-body{padding:18px;}
  .deck-card-title{font-family:var(--serif); font-size:20px; color:var(--text); margin-bottom:8px;}
  .deck-card-explain{font-size:14px; color:var(--text-dim); line-height:1.6; margin-bottom:16px;}
  .deck-answers{display:flex; flex-direction:column; gap:8px;}
  .deck-answer-btn{
    background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:13px 14px; border-radius:var(--radius-s); font-size:14px; text-align:left;
  }
  .deck-answer-btn.selected{background:var(--wine); border-color:var(--wine); color:#fff; font-weight:600;}

  .answer-gauge{position:relative; padding:6px 0 4px; margin-top:6px;}
  .gauge-track{
    position:absolute; top:26px; left:22px; right:22px; height:3px; border-radius:2px;
    background:linear-gradient(90deg, #3D6690, #7FAAC7, #A8A196, #D9A65C, #C24C63);
  }
  .gauge-row{display:flex; justify-content:space-between; position:relative; z-index:1;}
  .gauge-stop{
    width:44px; height:44px; border-radius:50%; background:var(--surface); border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0;
  }
  .gauge-stop.selected{border-color:var(--gold); background:var(--gold); transform:scale(1.08);}

  .teaser-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:20px 0;}
  .teaser-block{height:44px; border-radius:var(--radius-s); opacity:0.9;}
  .teaser-block.cold_card{background:#3D6690;}
  .teaser-block.just_for_you{background:#7FAAC7;}
  .teaser-block.blushing_yes{background:#A8A196;}
  .teaser-block.warming_up{background:#D9A65C;}
  .teaser-block.full_spark{background:#C24C63;}
  .teaser-legend{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:20px;}
  .teaser-legend-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim);}
  .teaser-legend-swatch{width:12px; height:12px; border-radius:3px; flex-shrink:0;}
  .privacy-note{
    background:var(--surface); border:1px solid var(--good); border-radius:var(--radius-m);
    padding:14px 16px; margin-bottom:22px;
  }
  .privacy-note .title{font-weight:600; font-size:14px; color:var(--text); margin-bottom:4px;}
  .privacy-note .body{font-size:13px; color:var(--text-dim);}
  .deck-nav{display:flex; justify-content:space-between; align-items:center; margin-top:14px;}
  .deck-nav button{background:none; border:none; color:var(--text-dim); font-size:14px; padding:8px;}
  .deck-nav button:disabled{opacity:0.3;}

  .image-upload-row{display:flex; align-items:center; gap:12px;}
  .image-preview{width:64px; height:64px; border-radius:var(--radius-s); object-fit:cover; background:var(--surface-raised); border:1px solid var(--line);}

  .modal-backdrop{

    position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:300;
    display:flex; align-items:flex-end;
  }
  .modal-sheet{
    background:var(--surface-raised); width:100%; max-width:520px; margin:0 auto;
    border-radius:16px 16px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto;
  }
  .modal-sheet h2{font-size:19px; margin-bottom:16px;}

  .celebrate-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:400;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .celebrate-card{
    background:linear-gradient(160deg, var(--wine), var(--gold));
    color:#fff; border-radius:20px; padding:36px 26px; text-align:center;
    max-width:400px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.4);
  }
  .celebrate-emoji{font-size:52px; margin-bottom:6px;}
  .celebrate-title{font-family:var(--serif); font-size:26px; font-weight:600; margin-bottom:6px;}
  .celebrate-name{font-size:14px; opacity:0.9; margin-bottom:18px;}
  .celebrate-points{font-family:var(--serif); font-size:56px; font-weight:700; line-height:1;}
  .celebrate-points-label{font-size:12px; text-transform:uppercase; letter-spacing:1.5px; opacity:0.85; margin-bottom:20px;}
  .celebrate-heat{font-size:13px; opacity:0.9; margin-bottom:24px;}

  .loading{display:flex; align-items:center; justify-content:center; height:100vh; color:var(--text-faint); font-size:13px;}
</style>
</head>
<body>
<div id="app"><div class="loading">Opening… <span style="opacity:0.5">(build 2.2.0)</span></div></div>

<script>

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function downloadCsv(filename, rows) {
  const csv = Papa.unparse(rows);
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' · ' +
         d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}
function fmtCountdown(iso) {
  if (!iso) return null;
  const diffMs = new Date(iso) - new Date();
  if (diffMs <= 0) return { text: 'Overdue', overdue: true };
  const mins = Math.floor(diffMs / 60000);
  const hrs = Math.floor(mins / 60);
  const days = Math.floor(hrs / 24);
  let text;
  if (days > 0) text = `${days}d ${hrs % 24}h left`;
  else if (hrs > 0) text = `${hrs}h ${mins % 60}m left`;
  else text = `${mins}m left`;
  return { text, overdue: false };
}

async function boot() {
  applyDayNightMode();
  // The boundary can be crossed while the app just sits open (nobody
  // reloads at exactly 6am or 7pm) — recheck periodically, and on
  // return-to-tab, rather than only at load.
  setInterval(applyDayNightMode, 10 * 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') applyDayNightMode(); });

  const urlParams = new URLSearchParams(window.location.search);
  const inviteFromUrl = urlParams.get('invite');
  if (inviteFromUrl) { state.urlInviteCode = inviteFromUrl.trim().toUpperCase(); state.authMode = 'signup'; }

  const { data: { session } } = await sb.auth.getSession();
  state.session = session;
  sb.auth.onAuthStateChange((_event, session) => {
    state.session = session;
    if (_event === 'PASSWORD_RECOVERY') { state.passwordRecoveryMode = true; render(); return; }
    if (session) loadEverything(); else { resetState(); render(); }
  });
  if (session) await loadEverything(); else state.loading = false;
  render();

  // Realtime is best-effort on mobile — locking the screen, switching
  // apps, or a brief signal drop can silently kill the WebSocket, and
  // anything that happened while disconnected is never retroactively
  // delivered even once it reconnects. This is the actual reliability
  // guarantee: whenever the app becomes visible again, pull fresh data
  // regardless of what the live connection did or didn't deliver.
  let lastVisibilityRefresh = Date.now();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !state.session) return;
    if (Date.now() - lastVisibilityRefresh < 4000) return; // avoid double-firing alongside focus
    lastVisibilityRefresh = Date.now();
    silentRefresh();
  });
  window.addEventListener('focus', () => {
    if (!state.session) return;
    if (Date.now() - lastVisibilityRefresh < 4000) return;
    lastVisibilityRefresh = Date.now();
    silentRefresh();
  });

  // visibilitychange/focus only fire on a transition — a tab that just
  // sits open and visible the whole session (e.g. a second monitor)
  // never triggers either, so realtime would be the only mechanism left
  // for it, which isn't reliable enough on its own. This periodic check
  // is the actual universal guarantee, independent of visibility state
  // entirely.
  setInterval(() => {
    if (state.session) silentRefresh();
  }, 45000);
}

function resetState() {
  state.profile = null; state.coupleId = null; state.partner = null;
  state.categories = []; state.questions = []; state.answers = {}; state.boundary = [];
  state.imageUrls = {}; state.avatarUrl = null; state.openCategory = null; state.openDareCategory = null; state.deckIndex = 0;
  state.wizardSkipped = new Set();
  state.headingAccess = [];
  state.cardReport = []; state.expandedHeadings = new Set(); state.expandedCardLists = new Set(); state.expandedAnswerCategories = new Set(); state.pendingComparisonCards = []; state.seenRevealedRewardIds = null; state.dareEvidence = []; state.forfeitEvidence = []; state.partnerRoleLean = 'unknown'; state.myWishlist = []; state.partnerWishlistCategories = []; state.narrativeContent = {}; state.pendingMagicLink = null; state.hasSeenAwaitingPartner = false; state.partnerJoinedPending = false;
  state.weeklyScore = []; state.currentSettlement = null; state.forfeitLibrary = [];
  state.viewingAllAnswers = false; state.allAnswersFilter = '';
  state.dares = []; state.scoreboard = []; state.heat = 0; state.rewards = [];
  state.notifications = []; state.tab = 'home';
}

// Day/night is purely a clock check now — nothing about it depends on
// login state or profile, so it's safe to call before either exists.
function computeDayOrNight() {
  const hour = new Date().getHours();
  return (hour >= 6 && hour < 19) ? 'day' : 'night';
}
function applyDayNightMode() {
  const mode = computeDayOrNight();
  document.body.classList.toggle('mode-day', mode === 'day');
  document.body.classList.toggle('mode-night', mode === 'night');
}

async function loadAllData() {
  try {
    await loadProfile();
    if (state.session && !state.profile) {
      // Arrived via a magic sign-in link, which skips the sign-up form
      // (and with it, the only place a profile row used to get created).
      // Create one silently with sensible defaults — she can rename
      // herself, or fix the gender default, in Account any time.
      const metaName = state.session.user.user_metadata && state.session.user.user_metadata.display_name;
      const fallbackName = (metaName && metaName.trim()) || (state.session.user.email || 'Player').split('@')[0];
      await sb.from('profiles').insert({ id: state.session.user.id, display_name: fallbackName, gender: 'female' });
      await loadProfile();
    }
    if (state.profile) {
      await loadCouple();
      if (!state.coupleId && state.urlInviteCode) {
        // Arrived via an invite link (magic-link flow never goes through
        // the sign-up form's own redeem step) but isn't paired yet —
        // redeem it now rather than requiring a manual step.
        const { error: redeemError } = await sb.rpc('redeem_couple_invite', { p_code: state.urlInviteCode });
        if (!redeemError) {
          state.urlInviteCode = null;
          // redeem_couple_invite() also sets arrival_stage on this profile
          // server-side — reload it too, not just the couple, or the stale
          // in-memory copy (still "skip") wins and the arrival sequence
          // never shows.
          await loadProfile();
          await loadCouple();
        }
      }
      if (state.coupleId) {
        await Promise.all([
          loadCategories(), loadQuestions(), loadOwnAnswers(), loadBoundary(), loadHeadingAccess(), loadCardReport(), loadDareLibrary(), loadDareEvidence(), loadForfeitEvidence(), loadPartnerRoleLean(), loadMyWishlist(), loadPartnerWishlistCategories(), loadNarrativeContent(),
          loadDares(), loadScoreboard(), loadHeat(), loadRewards(), loadNotifications(), loadWeeklyScore(), loadForfeitLibrary()
        ]);
        checkForNewlyRevealedRewards();
        await sb.rpc('settle_past_weeks');
        await Promise.all([loadCurrentSettlement(), loadSettlementHistory()]);
        subscribeRealtime();
      }
    }
  } catch (e) {
    console.error(e);
  }
}

function checkForNewlyRevealedRewards() {
  const currentlyRevealed = state.rewards
    .filter(r => !r.completed && (r.heat_threshold === null || state.heat >= r.heat_threshold))
    .map(r => r.id);
  if (state.seenRevealedRewardIds === null) {
    // First load this session — seed silently, nothing here is "new."
    state.seenRevealedRewardIds = new Set(currentlyRevealed);
    return;
  }
  const newlyRevealed = state.rewards.filter(r => currentlyRevealed.includes(r.id) && !state.seenRevealedRewardIds.has(r.id));
  newlyRevealed.forEach(r => {
    state.seenRevealedRewardIds.add(r.id);
    showToast(`🎁 A reward just unlocked: "${r.title}"`);
  });
}

async function loadEverything() {
  state.loading = true; render();
  await loadAllData();
  state.loading = false;
  render();
  if (isOnboardingComplete()) checkForCompletionReveal();
}

// Same data refresh as loadEverything, but without the full-screen
// loading flash — for re-syncing quietly when the app becomes active
// again, where the person is already looking at real content.
async function silentRefresh() {
  if (!state.session) return;
  // A background render while a modal is open re-inserts the same modal
  // HTML but never re-attaches its button handlers — only the function
  // that originally opened it does that. The modal looks identical but
  // stops responding to anything except clicking outside it. Skip
  // entirely while one's open; it'll catch up on the next trigger once
  // it closes.
  if (state.modal) return;
  // Same problem as a modal, different shape: a background render while a
  // narrative field is mid-edit replaces the whole screen's HTML, and with
  // it, whatever you'd typed but not yet saved — the new DOM comes back
  // from nc()/state.narrativeContent, which still holds the old value.
  // Skip entirely while a narrative page is open; it'll catch up once you
  // back out to the page list.
  if (state.narrativeEditorGroup) return;
  await loadAllData();
  render();
  if (isOnboardingComplete()) checkForCompletionReveal();
}

function isOnboardingComplete() {
  // Deliberately not checking seen_wizard_intro here — that flag can go
  // stale (e.g. after using "Preview my onboarding again" without fully
  // re-walking the flow) without actually blocking anything, since the
  // six-things-to-explore screen can only ever show when there's a
  // genuinely unanswered general question. Checking the real condition
  // instead of the flag makes this self-healing regardless of how the
  // flag got out of sync.
  const noGeneralQuestionsPending = getWizardQuestions().filter(q => !state.answers[q.id]).length === 0;
  return !!(state.profile && noGeneralQuestionsPending);
}

async function checkForCompletionReveal() {
  const unread = state.notifications.filter(n => !n.read);
  if (!unread.length) { await runEngagementChecks(); return; }

  const notif = unread[0];
  await sb.from('notifications').update({ read: true }).eq('id', notif.id);
  state.notifications = state.notifications.filter(n => n.id !== notif.id);

  if (notif.message === 'Your dare was completed.' && notif.dare_id) {
    await loadDares(); // guard against a race where this fires before the dare's own points have synced
    const dare = state.dares.find(d => d.id === notif.dare_id);
    if (dare) {
      const heatGain = Math.max(1, Math.round((dare.points_awarded || 0) / 10));
      celebrateCompletion({
        title: dare.title,
        byName: state.partner ? state.partner.display_name : 'Your partner',
        points: dare.points_awarded,
        bonusPoints: dare.quality_bonus_points,
        heatGain,
        onContinue: checkForCompletionReveal // process the rest of the queue once this is dismissed
      });
      return;
    }
  } else if (notif.message === 'Your dare was accepted.' && notif.dare_id) {
    await loadDares();
    const dare = state.dares.find(d => d.id === notif.dare_id);
    const label = dare && !dare.blind_sent ? `"${dare.title}"` : 'your dare';
    showToast(`🎉 ${state.partner ? state.partner.display_name : 'Your partner'} accepted ${label}!`);
  } else if (notif.message === 'Your dare got a reaction.' && notif.dare_id) {
    await loadDares();
    const dare = state.dares.find(d => d.id === notif.dare_id);
    if (dare && dare.quality_reaction) {
      const reactionLabel = { meh: 'Meh', good: 'Good', loved_it: 'Loved it' }[dare.quality_reaction] || dare.quality_reaction;
      showToast(`${state.partner ? state.partner.display_name : 'Your partner'} reacted "${reactionLabel}" to "${dare.title}"${dare.quality_bonus_points ? ` (+${dare.quality_bonus_points} bonus)` : ''}`);
    }
  } else if (notif.message === 'Your partner answered something new.') {
    await runEngagementChecks(); // may open the comparison modal directly; no toast needed either way
  } else if (notif.message !== 'You have a new dare waiting.') {
    // Already covered live by the Playroom hero banner, so skip it silently.
    // Anything else unrecognized still gets shown rather than silently
    // dropped — this is what the earlier bug was: a message type nobody
    // wrote a case for just vanished. A plain toast is a safe fallback.
    showToast(notif.message);
  }

  // A batch of notifications shouldn't flash past each other unseen.
  await new Promise(r => setTimeout(r, 2600));
  await checkForCompletionReveal();
}

// One step at a time: pending comparisons first, then a forfeit that
// needs picking. Each modal's own close/answer handler calls this again,
// so the chain naturally continues until nothing's left to show.
async function runEngagementChecks() {
  const { data, error } = await sb.rpc('get_pending_comparison_cards');
  state.pendingComparisonCards = (!error && data) ? data : [];
  if (state.pendingComparisonCards.length) { openComparisonQuestionModal(state.pendingComparisonCards[0]); return; }
  await checkForPendingForfeit();
  render();
}

async function checkForPendingForfeit() {
  const s = state.currentSettlement;
  if (s && s.loser_id === state.session.user.id && !s.forfeit_title) {
    openForfeitPickerModal(s);
  }
}

function openComparisonQuestionModal(q) {
  state.modal = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal-sheet">
        <h2>Your turn to weigh in</h2>
        <p class="hint-text" style="margin-bottom:14px">${esc(state.partner ? state.partner.display_name : 'Your partner')} shared where they stand on this in ${esc(q.category)} — here's your chance to answer the same question, so you can see how you compare.</p>
        <div class="deck-card-title" style="margin-bottom:8px">${esc(q.title)}</div>
        ${q.explanation ? `<div class="deck-card-explain" style="margin-bottom:12px">${esc(q.explanation)}</div>` : ''}
        ${renderAnswerControl(q, null, (a) => `data-comparison-answer="${a}" data-comparison-id="${q.question_id}"`)}
        <button class="link-btn" id="modal-cancel" style="margin-top:16px">Skip for now</button>
      </div>
    </div>
  `;
  render();
  document.getElementById('modal-cancel').onclick = () => { closeModal(); runEngagementChecks(); };
  $app.querySelectorAll('[data-comparison-answer]').forEach(el => el.onclick = async () => {
    const qId = el.dataset.comparisonId, val = el.dataset.comparisonAnswer;
    state.answers[qId] = val;
    await sb.from('boundary_answers').upsert({ user_id: state.session.user.id, question_id: qId, answer: val, updated_at: new Date().toISOString() }, { onConflict: 'user_id,question_id' });
    await loadBoundary(); await loadHeadingAccess(); await loadCardReport();
    closeModal();
    showToast('Answer saved — your temptation picture just updated.');
    runEngagementChecks();
  });
}


async function loadProfile() {
  const { data } = await sb.from('profiles').select('*').eq('id', state.session.user.id).maybeSingle();
  state.profile = data || null;
  state.avatarUrl = null;
  if (state.profile && state.profile.avatar_path) {
    const { data: signed } = await sb.storage.from('avatars').createSignedUrl(state.profile.avatar_path, 3600);
    if (signed && signed.signedUrl) state.avatarUrl = signed.signedUrl;
  }
}

async function loadCouple() {
  const hadPartnerBefore = !!state.partner;
  const { data } = await sb.from('couple_members').select('couple_id').eq('user_id', state.session.user.id).maybeSingle();
  state.coupleId = data ? data.couple_id : null;
  state.partner = null;
  const previousCode = state.pendingInviteCode;
  state.pendingInviteCode = null;
  if (state.coupleId) {
    const { data: partner } = await sb.rpc('get_partner_profile');
    state.partner = (partner && partner[0]) || null;
    if (!state.partner) {
      const { data: code } = await sb.rpc('get_active_invite_code');
      state.pendingInviteCode = code || null;
    }
  }
  // A generated sign-in link is only valid for the code it was built
  // against — drop it if the active code has changed underneath.
  if (state.pendingInviteCode !== previousCode) state.pendingMagicLink = null;

  // The moment a partner appears where there wasn't one a load ago — but
  // only if this session actually watched the Awaiting Partner screen for
  // it (set below in render()). Without that guard, an ordinary fresh
  // login into an already-paired couple would fire this every time, which
  // isn't "they just joined," it's just you opening the app.
  // This sets a blocking flag rather than a toast — a toast can fire and
  // clear itself while you're not looking at the screen, so you'd never
  // actually see it. The blocking screen waits for you, however long that is.
  if (!hadPartnerBefore && state.partner && state.hasSeenAwaitingPartner) {
    state.hasSeenAwaitingPartner = false;
    state.partnerJoinedPending = true;
    fireConfetti();
  }
}

function nc(key) {
  return (state.narrativeContent && state.narrativeContent[key]) || NARRATIVE_DEFAULTS[key] || '';
}
function ncr(key, vars) {
  let s = nc(key);
  for (const k in vars) s = s.split(`{{${k}}}`).join(vars[k]);
  return s;
}
async function loadWeeklyScore() {
  const { data, error } = await sb.rpc('get_weekly_score');
  state.weeklyScore = error ? [] : (data || []);
}
async function loadForfeitLibrary() {
  const { data, error } = await sb.from('forfeit_library').select('*').eq('active', true).order('sort_order');
  state.forfeitLibrary = error ? [] : (data || []);
}
async function loadCurrentSettlement() {
  const { data, error } = await sb.from('weekly_settlements').select('*').order('week_start', { ascending: false }).limit(1).maybeSingle();
  state.currentSettlement = error ? null : data;
}
async function loadSettlementHistory() {
  const { data, error } = await sb.from('weekly_settlements').select('*').order('week_start', { ascending: false });
  state.settlementHistory = error ? [] : (data || []);
}
async function loadDares() {
  const { data } = await sb.from('dares').select('*').order('created_at', { ascending: false });
  state.dares = data || [];
}
async function loadScoreboard() {
  const { data } = await sb.rpc('get_scoreboard');
  state.scoreboard = data || [];
}
async function loadHeat() {
  const { data } = await sb.from('heat_meter').select('progress').eq('couple_id', state.coupleId).maybeSingle();
  state.heat = data ? data.progress : 0;
}
async function loadRewards() {
  const { data } = await sb.from('rewards').select('*').order('heat_threshold', { ascending: true, nullsFirst: false });
  state.rewards = data || [];
}
async function loadNotifications() {
  const { data } = await sb.from('notifications').select('*').eq('read', false).order('created_at', { ascending: false });
  state.notifications = data || [];
}

let realtimeChannel = null;
function subscribeRealtime() {
  if (realtimeChannel) return;
  realtimeChannel = sb.channel('couple-' + state.coupleId)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'dares', filter: `couple_id=eq.${state.coupleId}` },
      async () => { await loadDares(); await loadScoreboard(); await loadHeat(); if (!state.modal) render(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'notifications', filter: `couple_id=eq.${state.coupleId}` },
      async () => { await loadNotifications(); if (state.modal) return; render(); if (isOnboardingComplete()) await checkForCompletionReveal(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rewards', filter: `couple_id=eq.${state.coupleId}` },
      async () => { await loadRewards(); if (!state.modal) render(); })
    .subscribe();
}

   ========================================================================== */
function getOrderedQuestions() {
  // Walks headings in their display order, and within each heading, cards
  // in their own order.
  const ordered = [];
  state.categories.forEach(c => {
    state.questions
      .filter(q => q.category === c.name)
      .sort((a, b) => a.sort_order - b.sort_order)
      .forEach(q => ordered.push(q));
  });
  return ordered;
}

function getWizardQuestions() {
  // The guided wizard only covers the one general "where do you sit on
  // this heading" question per heading — not every specific card. Specific
  // cards are answered later, by choice, when browsing a heading directly.
  return getOrderedQuestions().filter(q => q.is_general);
}

// Renders the heart-to-freezing gauge used for general "where do you sit"
// questions, or the plain button list used for specific cards. `attrs` is
// the data-* attribute string each stop gets, so the caller's existing
// click handler (wizard or deck view) keeps working unchanged — only the
// visual markup differs.
function renderAnswerControl(q, currentAnswer, attrsFor) {
  if (!q.is_general) {
    return `
      <div class="deck-answers">
        ${ANSWER_ORDER.map(a => `
          <button class="deck-answer-btn ${currentAnswer===a?'selected':''}" ${attrsFor(a)}>${ANSWER_LABELS[a]}</button>
        `).join('')}
      </div>
    `;
  }
  return `
    <div class="answer-gauge">
      <div class="gauge-track"></div>
      <div class="gauge-row">
        ${GAUGE_ORDER.map(a => `
          <button class="gauge-stop ${currentAnswer===a?'selected':''}" ${attrsFor(a)}>${GAUGE_ICONS[a]}</button>
        `).join('')}
      </div>
    </div>
  `;
}

// A single locked-door beat, shown once, right before the six-things-to-explore
// screen — the only atmosphere left in-app now that the actual tease lives in
// texts/WhatsApp beforehand. One tap, no essay. Full-bleed photo backdrop —
// the door's own "Enter" carries the headline, so there's no separate title
// overlay to clash with it; just an optional caption and the button.
function renderReadyGate() {
  return `
    <div class="ready-door-screen" style="background-image:url('${READY_GATE_PHOTO}')">
      <div class="ready-door-scrim"></div>
      <div class="ready-door-content">
        ${nc('ready_gate_subtitle') ? `<p>${esc(nc('ready_gate_subtitle'))}</p>` : ''}
        <button type="button" class="btn btn-gold" id="btn-ready-gate-continue" style="width:100%">${esc(nc('ready_gate_cta'))}</button>
      </div>
    </div>
  `;
}
function attachReadyGateHandlers() {
  const btn = document.getElementById('btn-ready-gate-continue');
  if (btn) btn.onclick = async () => {
    state.profile.seen_ready_gate = true;
    render();
    await sb.from('profiles').update({ seen_ready_gate: true }).eq('id', state.session.user.id);
  };
}

function renderWizard(q, remaining) {
  if (q.image_path && !state.imageUrls[q.image_path]) fetchSignedImageUrl(q.image_path);
  const imgUrl = q.image_path ? state.imageUrls[q.image_path] : null;
  const totalGeneral = getWizardQuestions().length;
  const answeredGeneral = totalGeneral - remaining;

  return `
    <div class="screen" style="padding-top:22px">
      <div class="deck-progress">${answeredGeneral + 1} of ${totalGeneral} — a general sense of each temptation</div>
      <div class="deck-card">
        ${imgUrl ? `<img src="${esc(imgUrl)}" alt="">` : ''}
        <div class="deck-card-body">
          <div class="hint-text" style="margin-bottom:6px">${esc(q.category)}</div>
          <div class="deck-card-title">${esc(q.title)}</div>
          ${q.explanation ? `<div class="deck-card-explain">${esc(q.explanation)}</div>` : ''}
          <p class="hint-text" style="margin:14px 0 4px">Tap wherever feels right — from "not for me" on the left, to "count me in" on the right.</p>
          ${renderAnswerControl(q, null, (a) => `data-wizard-answer="${a}"`)}
        </div>
      </div>
      <button class="link-btn" id="btn-wizard-skip" style="margin-top:14px">Skip for now, come back to this later</button>
      ${remaining > 1 ? `<p class="hint-text" style="margin-top:6px">${remaining - 1} more after this one.</p>` : ''}
    </div>
  `;
}

function attachWizardHandlers(q) {
  $app.querySelectorAll('[data-wizard-answer]').forEach(el => el.onclick = async () => {
    const val = el.dataset.wizardAnswer;
    state.answers[q.id] = val;
    render();
    await sb.from('boundary_answers').upsert({ user_id: state.session.user.id, question_id: q.id, answer: val, updated_at: new Date().toISOString() }, { onConflict: 'user_id,question_id' });
    await loadBoundary(); await loadHeadingAccess(); await loadCardReport();
    render();
  });
  const skipBtn = document.getElementById('btn-wizard-skip');
  if (skipBtn) skipBtn.onclick = () => { state.wizardSkipped.add(q.id); render(); };
}

function render() {
  document.body.classList.toggle('admin-wide', state.tab === 'admin');
  if (state.loading) { $app.innerHTML = `<div class="loading">Opening… <span style="opacity:0.5">(build ${APP_VERSION})</span></div>`; return; }
  if (state.passwordRecoveryMode) { $app.innerHTML = renderPasswordRecovery(); attachPasswordRecoveryHandlers(); return; }
  if (!state.session) { $app.innerHTML = renderAuth(); attachAuthHandlers(); return; }
  if (!state.profile) { $app.innerHTML = renderCreateProfile(); attachCreateProfileHandlers(); return; }
  if (!state.profile.gender) { $app.innerHTML = renderChooseTheme(); attachChooseThemeHandlers(); return; }
  if (!state.coupleId) { $app.innerHTML = renderPairing(); attachPairingHandlers(); return; }
  if (!state.partner) { state.hasSeenAwaitingPartner = true; $app.innerHTML = renderAwaitingPartner(); attachAwaitingPartnerHandlers(); return; }
  if (state.partnerJoinedPending) { $app.innerHTML = renderPartnerJoined(); attachPartnerJoinedHandlers(); return; }

  // Onboarding is now everything outside the app (texts, WhatsApp, whatever) —
  // the only in-app lead-in left is a one-tap "ready?" gate, then the six
  // things to explore, then straight to the six questions themselves.
  const wizardQueue = getWizardQuestions().filter(q => !state.answers[q.id] && !state.wizardSkipped.has(q.id));
  if (wizardQueue.length > 0 && state.profile && !state.profile.seen_ready_gate) {
    $app.innerHTML = renderReadyGate();
    attachReadyGateHandlers();
    return;
  }
  if (wizardQueue.length > 0 && state.profile && !state.profile.seen_wizard_intro) {
    $app.innerHTML = renderTemptationsPreview();
    attachTemptationsPreviewHandlers();
    return;
  }
  if (wizardQueue.length > 0) { $app.innerHTML = renderWizard(wizardQueue[0], wizardQueue.length); attachWizardHandlers(wizardQueue[0]); return; }

  const step1Complete = state.headingAccess.length > 0 && state.headingAccess.every(h => h.access !== 'pending');
  if (step1Complete && state.profile && !state.profile.seen_step1_complete) {
    $app.innerHTML = renderStep1Complete(); attachStep1CompleteHandlers(); return;
  }

  const unanswered = getWizardQuestions().filter(q => !state.answers[q.id]).length;

  let body = '';
  if (state.tab === 'home') body = renderHome(unanswered);
  else if (state.tab === 'dares') body = renderDaresTab();
  else if (state.tab === 'boundaries') body = renderBoundariesTab(unanswered);
  else if (state.tab === 'rewards') body = renderRewardsTab();
  else if (state.tab === 'history') body = renderHistoryTab();
  else if (state.tab === 'admin') body = renderSetupArea();

  const initial = state.profile && state.profile.display_name ? state.profile.display_name.charAt(0).toUpperCase() : '?';
  $app.innerHTML = `
    <div class="topbar">
      <button class="topbar-identity" id="btn-open-account">
        <div class="topbar-avatar">
          ${state.avatarUrl ? `<img src="${esc(state.avatarUrl)}" alt="">` : `<div class="avatar-initial">${esc(initial)}</div>`}
        </div>
        <div class="topbar-name">${esc(state.profile ? state.profile.display_name : '')}</div>
      </button>
      <div>
        <div class="wordmark">TwoPlay</div>
        <div class="version" id="version-tap" style="text-decoration:underline; text-underline-offset:2px; cursor:pointer">v${APP_VERSION}</div>
      </div>
    </div>
    <div class="screen">${body}</div>
    ${renderTabbar()}
    ${state.toast ? `<div class="toast">${esc(state.toast)}</div>` : ''}
    ${state.modal || ''}
  `;
  attachMainHandlers();
}

function renderPasswordRecovery() {
  return `
    <div class="center-screen">
      <div class="auth-hero">
        <h1>Set a new password</h1>
        <p>Choose a new password for this account.</p>
      </div>
      <form id="recovery-form" class="stack">
        <div class="field"><label>New password</label><input type="password" id="recovery-password" minlength="8" required></div>
        ${state.authError ? `<div class="error-text">${esc(state.authError)}</div>` : ''}
        <button type="submit" class="btn btn-primary">Set password</button>
      </form>
    </div>
  `;
}
function attachPasswordRecoveryHandlers() {
  const form = document.getElementById('recovery-form');
  if (form) form.onsubmit = async (e) => {
    e.preventDefault();
    state.authError = '';
    const password = document.getElementById('recovery-password').value;
    const { error } = await sb.auth.updateUser({ password });
    if (error) { state.authError = error.message; render(); return; }
    state.passwordRecoveryMode = false;
    await loadEverything();
    showToast('Password updated.');
  };
}

function renderAuth() {
  return `
    <div class="center-screen">
      <div class="auth-hero">
        <h1>TwoPlay</h1>
        <p>A private, two-player game. Just for the two of you.</p>
      </div>
      ${state.urlInviteCode ? `<p class="hint-text" style="margin-bottom:14px">You've been invited — create an account below, and the invite will carry through automatically.</p>` : ''}
      <div class="auth-tabs">
        <button class="auth-tab ${state.authMode==='signin'?'active':''}" data-authmode="signin">Sign in</button>
        <button class="auth-tab ${state.authMode==='signup'?'active':''}" data-authmode="signup">Create account</button>
      </div>
      <form id="auth-form" class="stack">
        ${state.authMode==='signup' ? `
        <div class="field"><label>Your name</label><input type="text" id="auth-name" placeholder="How your partner will see you" required></div>` : ''}
        <div class="field"><label>Email</label><input type="email" id="auth-email" required></div>
        <div class="field"><label>Password</label><input type="password" id="auth-password" minlength="8" required></div>
        ${state.authError ? `<div class="error-text">${esc(state.authError)}</div>` : ''}
        <button type="submit" class="btn btn-primary">${state.authMode==='signin' ? 'Sign in' : 'Create account'}</button>
        ${state.authMode==='signin' ? `<button type="button" class="link-btn" id="btn-forgot-password" style="margin-top:4px">Forgot password?</button>` : ''}
      </form>
    </div>
  `;
}
function attachAuthHandlers() {
  $app.querySelectorAll('[data-authmode]').forEach(b => b.onclick = () => {
    state.authMode = b.dataset.authmode; state.authError = ''; render();
  });
  const forgotBtn = document.getElementById('btn-forgot-password');
  if (forgotBtn) forgotBtn.onclick = () => openForgotPasswordModal();
  const form = document.getElementById('auth-form');
  if (form) form.onsubmit = async (e) => {
    e.preventDefault();
    state.authError = '';
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    try {
      if (state.authMode === 'signup') {
        const name = document.getElementById('auth-name').value.trim();
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        if (data.user) {
          // Gender defaults here rather than asking at sign-up — it only
          // matters for matching content later, never for anything shown
          // this early, and it's a one-tap fix in Account any time. Asking
          // for it here just adds a form to a screen that should feel like
          // nothing more than "you're in."
          await sb.from('profiles').insert({ id: data.user.id, display_name: name || email.split('@')[0], gender: 'female' });
        }
        state.session = data.session;
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        state.session = data.session;
      }
      if (state.session && state.urlInviteCode) {
        // Carry the invite straight through — no separate "Pairing" screen,
        // no extra button to press. If this fails (expired code, say) she
        // still lands on the manual Pairing screen as a fallback.
        const { error: redeemError } = await sb.rpc('redeem_couple_invite', { p_code: state.urlInviteCode });
        if (!redeemError) state.urlInviteCode = null;
      }
      await loadEverything();
    } catch (err) {
      state.authError = err.message || 'Something went wrong.';
      render();
    }
  };
}

async function copyRichEmailToClipboard(html) {
  const plain = html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  const item = new ClipboardItem({
    'text/html': new Blob([html], { type: 'text/html' }),
    'text/plain': new Blob([plain], { type: 'text/plain' })
  });
  await navigator.clipboard.write([item]);
}

function attachAwaitingPartnerHandlers() {
  document.getElementById('btn-new-code').onclick = async () => {
    state.authError = '';
    const { data, error } = await sb.rpc('create_additional_invite');
    if (error) { state.authError = error.message; render(); return; }
    state.pendingInviteCode = data;
    state.pendingMagicLink = null; // a new code needs its own sign-in link, generated fresh
    render();
  };
  document.getElementById('btn-refresh-status').onclick = async () => { await loadEverything(); };
  const magicLinkBtn = document.getElementById('btn-generate-magic-link');
  if (magicLinkBtn) magicLinkBtn.onclick = async () => {
    const errEl = document.getElementById('magic-link-error');
    const email = document.getElementById('invite-email-address').value.trim();
    const name = document.getElementById('invite-magic-name').value.trim();
    if (!email) { errEl.textContent = 'Enter their email first.'; return; }
    magicLinkBtn.disabled = true;
    errEl.textContent = '';
    const redirectTo = buildInviteUrl(state.pendingInviteCode);
    const { data, error } = await sb.functions.invoke('invite_by_email', { body: { email, redirectTo, name: name || undefined } });
    magicLinkBtn.disabled = false;
    if (error || !data || !data.link) {
      errEl.textContent = (data && data.error) || (error && error.message) || 'Could not generate a sign-in link.';
      return;
    }
    state.pendingMagicLink = data.link;
    render();
  };
  const copyBtn = document.getElementById('btn-copy-invite-link');
  if (copyBtn) copyBtn.onclick = async () => {

      linkInput.select();
      showToast('Copy failed — select the text and copy manually.');
    }
  };

  if (copySubjectBtn) copySubjectBtn.onclick = async () => {
    try {
      await navigator.clipboard.writeText(INVITE_EMAIL_SUBJECT);
      showToast('Subject copied.');
    } catch {
      showToast('Copy failed — select the text and copy manually.');
    }
  };

  if (copyEmailBtn) copyEmailBtn.onclick = async () => {
    const name = document.getElementById('invite-email-name').value.trim();

}

/* ==========================================================================
   HOME TAB
   ========================================================================== */
function renderInPlayHero() {
  const active = state.dares.filter(d => ['accepted','in_progress','countered'].includes(d.status));
  if (!active.length) return '';

  // Show whichever has the soonest deadline; dares with no deadline sort last.
  const sorted = [...active].sort((a, b) => {
    if (!a.deadline && !b.deadline) return 0;
    if (!a.deadline) return 1;
    if (!b.deadline) return -1;
    return new Date(a.deadline) - new Date(b.deadline);
  });
  const d = sorted[0];
  const isRecipient = d.recipient_id === state.session.user.id;
  const isMine = d.creator_id === state.session.user.id;
  const stillBlindForSender = d.blind_sent && isMine;
  const countdown = fmtCountdown(d.deadline);
  const more = active.length - 1;

  return `
    <div class="inplay-hero">
      <div class="inplay-hero-label"><span class="inplay-hero-dot"></span>Dare In Play</div>
      <div class="inplay-hero-title">${stillBlindForSender ? '🙈 Blind dare' : esc(d.title)}</div>
      ${countdown
        ? `<div class="inplay-hero-countdown ${countdown.overdue ? 'overdue' : ''}">${esc(countdown.text)}</div>`
        : `<div class="inplay-hero-sub">No deadline set</div>`}
      <div class="inplay-hero-sub">${isRecipient ? "It's on you to complete this one." : `Waiting on ${esc(state.partner ? state.partner.display_name : 'them')} to complete it.`}</div>
      ${more > 0 ? `<div class="inplay-hero-more">+${more} more dare${more===1?'':'s'} in play</div>` : ''}
    </div>
  `;
}

function computeTurnMessage() {
  const completed = state.dares.filter(d => d.status === 'completed' && d.completed_at);
  if (!completed.length) return null;
  const mostRecent = completed.reduce((a, b) => new Date(a.completed_at) > new Date(b.completed_at) ? a : b);
  const turnUserId = mostRecent.recipient_id; // whoever just completed a dare is nudged to send the next one
  if (turnUserId === state.session.user.id) return "It's your turn to send a dare, whenever you're ready.";
  const partnerName = state.partner ? state.partner.display_name : 'Your partner';
  return `It's ${partnerName}'s turn to send a dare — you can still send one anytime too.`;
}

function renderHome(unanswered) {
  const pendingForMe = state.dares.filter(d => d.recipient_id === state.session.user.id && d.status === 'sent');
  const pendingFromMe = state.dares.filter(d => d.creator_id === state.session.user.id && d.status === 'sent');
  const nextReward = state.rewards.find(r => !r.completed && r.heat_threshold && r.heat_threshold > state.heat);
  const turnMessage = computeTurnMessage();
  const inPlayHtml = renderInPlayHero();

  return `
    ${inPlayHtml}
    ${!inPlayHtml && pendingForMe.length ? `
      <div class="inplay-hero" style="background:linear-gradient(135deg, var(--gold), var(--wine))">
        <div class="inplay-hero-label"><span class="inplay-hero-dot"></span>Waiting On You</div>
        <div class="inplay-hero-title">${pendingForMe.length} dare${pendingForMe.length===1?'':'s'} to respond to</div>
        <div class="inplay-hero-sub">Head to Dares to accept, decline, or counter.</div>
      </div>
    ` : ''}
    ${!inPlayHtml && !pendingForMe.length && pendingFromMe.length ? `
      <div class="inplay-hero" style="background:linear-gradient(135deg, var(--gold), var(--wine))">
        <div class="inplay-hero-label"><span class="inplay-hero-dot"></span>Waiting On ${esc(state.partner ? state.partner.display_name : 'Them')}</div>
        <div class="inplay-hero-title">${pendingFromMe.length} dare${pendingFromMe.length===1?'':'s'} still to be answered</div>
        <div class="inplay-hero-sub">Nothing to do — just sitting with ${esc(state.partner ? state.partner.display_name : 'them')} for now.</div>
      </div>
    ` : ''}
    ${!inPlayHtml && !pendingForMe.length && !pendingFromMe.length && !unanswered ? `<div class="empty-state" style="margin-bottom:18px">You're all caught up.</div>` : ''}
    ${unanswered > 0 ? `<div class="hint-text" style="margin-bottom:18px">${unanswered} boundary question${unanswered===1?'':'s'} still to answer.</div>` : ''}
    ${turnMessage ? `<div class="hint-text" style="margin-bottom:18px">${esc(turnMessage)}</div>` : ''}

    ${renderScoreboard()}
    ${renderWeeklyScore()}
    ${renderForfeitStatus()}
    ${renderHeatBlock(nextReward)}

    <button class="btn btn-gold" data-nav="create-dare" style="margin-bottom:8px">Create a dare</button>
    <button class="link-btn" data-tab="dares" style="display:block; text-align:center">See all your dares →</button>
  `;
}

function renderWeeklyScore() {
  if (!state.weeklyScore.length) return '';

  const theirs = state.weeklyScore.find(s => s.user_id !== state.session.user.id);
  return `
    <div class="hint-text" style="margin-bottom:18px">
      This week: ${state.profile ? esc(state.profile.display_name) : 'You'} ${mine ? mine.score : 0} · ${state.partner ? esc(state.partner.display_name) : 'Them'} ${theirs ? theirs.score : 0}

}

function renderForfeitStatus() {
  const s = state.currentSettlement;
  if (!s || !s.loser_id) return '';
  const isLoser = s.loser_id === state.session.user.id;
  const loserName = isLoser ? 'You' : (state.partner ? state.partner.display_name : 'They');
  const winnerName = isLoser ? (state.partner ? state.partner.display_name : 'They') : 'You';

  if (!s.forfeit_title) {
    return `<div class="hint-text" style="margin-bottom:18px">${esc(winnerName)} won last week (${s.winner_points} to ${s.loser_points}) — ${isLoser ? 'pick your forfeit below.' : `waiting on ${esc(loserName)} to pick theirs.`}</div>`;

function openForfeitDetailModal(settlement) {
  const isLoser = settlement.loser_id === state.session.user.id;
  const loserName = isLoser ? 'You' : (state.partner ? state.partner.display_name : 'They');
  state.modal = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal-sheet">
        <h2>${esc(settlement.forfeit_title)}</h2>
        <p class="hint-text" style="margin-bottom:14px">${esc(loserName)} lost the week ${settlement.loser_points} to ${settlement.winner_points}.</p>
        <div class="dare-instructions" style="margin-bottom:16px">${esc(settlement.forfeit_instructions)}</div>
        ${isLoser ? `
        <div class="field" style="margin-bottom:16px">
          <label>Evidence photo (optional)</label>
          <input type="file" id="forfeit-evidence-file" accept="image/*">
        </div>
        <div class="stack" style="margin-bottom:10px">
          <button type="button" class="btn btn-primary" data-forfeit-modal-action="complete" data-completion-kind="no_proof">Completed</button>
          <button type="button" class="btn btn-ghost" data-forfeit-modal-action="complete" data-completion-kind="proof_in_person">Completed — proof shown in person</button>
          <button type="button" class="btn btn-ghost" data-forfeit-modal-action="complete" data-completion-kind="proof_sent_externally">Completed — proof sent separately</button>
          <button type="button" class="btn btn-ghost" data-forfeit-modal-action="complete" data-completion-kind="confirmed_by_partner">Completed — confirmed by ${esc(state.partner ? state.partner.display_name : 'partner')}</button>
        </div>` : ''}
        <button type="button" class="btn btn-ghost" data-forfeit-modal-action="close" style="width:100%">Close</button>
      </div>
    </div>
  `;
  render();
  const backdrop = document.getElementById('modal-backdrop');
  if (backdrop) {
    backdrop.addEventListener('click', async (e) => {
      const actionEl = e.target.closest('[data-forfeit-modal-action]');
      if (!actionEl) return;
      if (actionEl.dataset.forfeitModalAction === 'close') { closeModal(); return; }
      if (actionEl.dataset.forfeitModalAction === 'complete') {
        const kind = actionEl.dataset.completionKind || 'no_proof';
        const evidenceFileInput = document.getElementById('forfeit-evidence-file');
        const evidenceFile = evidenceFileInput ? evidenceFileInput.files[0] : null;
        const { error } = await sb.rpc('complete_forfeit', { p_settlement_id: settlement.id, p_completion_kind: kind });
        if (error) { showToast(error.message); return; }
        if (evidenceFile) {
          const ext = evidenceFile.name.split('.').pop();
          const path = `${state.coupleId}/${settlement.id}/${crypto.randomUUID()}.${ext}`;
          const { error: uploadError } = await sb.storage.from('forfeit-evidence').upload(path, evidenceFile);
          if (!uploadError) {
            await sb.from('forfeit_evidence').insert({ settlement_id: settlement.id, couple_id: state.coupleId, uploaded_by: state.session.user.id, path });
          }
        }
        await loadCurrentSettlement();
        closeModal();
        showToast('Forfeit marked complete.');
      }
    });
  }
}

function renderScoreboard() {
  if (!state.scoreboard.length) return '';
  const mine = state.scoreboard.find(s => s.user_id === state.session.user.id);
  const theirs = state.scoreboard.find(s => s.user_id !== state.session.user.id);
  const leadMine = mine && theirs && mine.score > theirs.score;
  const leadTheirs = mine && theirs && theirs.score > mine.score;
  return `
    <div class="scoreboard">
      <div class="score-card ${leadMine?'leading':''}"><div class="name">${esc(mine ? state.profile.display_name : '')}</div><div class="points">${mine ? mine.score : 0}</div></div>
      <div class="score-card ${leadTheirs?'leading':''}"><div class="name">${esc(state.partner ? state.partner.display_name : 'Partner')}</div><div class="points">${theirs ? theirs.score : 0}</div></div>
    </div>
  `;
}

function renderHeatBlock(nextReward) {
  return `
    <div class="heat-block">
      <div class="heat-head"><span class="label">Heat Meter</span><span class="pct">${state.heat}%</span></div>
      <div class="heat-track"><div class="heat-fill" style="width:${state.heat}%"></div></div>
      <div class="heat-next">${nextReward ? `Next: ${esc(nextReward.title)} at ${nextReward.heat_threshold}%` : (state.heat >= 100 ? 'Fully unlocked' : 'Keep playing to build anticipation')}</div>
    </div>
  `;
}

/* ==========================================================================
   DARE CARD
   ========================================================================== */
function renderDareCard(d, actionable, compact) {
  const isMine = d.creator_id === state.session.user.id;
  const isRecipient = d.recipient_id === state.session.user.id;
  const stillBlindForSender = d.blind_sent && isMine && ['sent', 'accepted', 'in_progress', 'countered'].includes(d.status);
  const revealed = !stillBlindForSender && (d.status !== 'sent' || isMine);
  const canReveal = isRecipient && d.status === 'sent';

  let body;
  if (stillBlindForSender) {
    body = `<div class="dare-body">🙈 Sent blind — you'll find out together once it's completed.</div>`;
  } else if (revealed && !canReveal) {
    if (d.image_path && !state.imageUrls[d.image_path]) fetchSignedImageUrl(d.image_path, 'dare-images');
    const imgUrl = d.image_path ? state.imageUrls[d.image_path] : null;
    body = `${imgUrl ? `<img src="${esc(imgUrl)}" style="width:100%; border-radius:var(--radius-s); margin-bottom:10px;">` : ''}<div class="dare-instructions">${esc(d.instructions)}</div>`;
  } else {
    body = `<div class="dare-body">${d.teaser ? esc(d.teaser) : 'Details hidden until you reveal it.'}</div>`;
  }

  let actions = '';
  if (actionable && d.status === 'sent' && isRecipient) {
    actions = `
      <div class="btn-row" style="margin-top:4px">
        <button class="btn btn-primary btn-small" data-dare-action="accept" data-dare-id="${d.id}">Accept</button>
        <button class="btn btn-ghost btn-small" data-dare-action="decline" data-dare-id="${d.id}">Decline</button>
        <button class="btn btn-ghost btn-small" data-dare-action="counter" data-dare-id="${d.id}">Counter</button>
      </div>`;
  } else if (['accepted','in_progress','countered'].includes(d.status) && isRecipient) {
    actions = `<div class="btn-row" style="margin-top:4px">
      <button class="btn btn-primary btn-small" data-dare-action="complete" data-dare-id="${d.id}">Mark complete</button>
    </div>`;
  } else if (d.status === 'countered' && isMine) {
    actions = stillBlindForSender
      ? `<div class="hint-text" style="margin-top:6px">They adjusted the terms — still hidden from you until it's done.</div>`
      : `<div class="hint-text" style="margin-top:6px">They countered — check the updated details above.</div>`;
  } else if (d.status === 'completed' && isMine) {
    let pieces = '';
    if (!d.quality_reaction) {
      pieces += `
        <div class="hint-text" style="margin-top:6px; margin-bottom:6px">How was it?</div>
        <div class="btn-row" style="margin-top:4px">
          <button class="btn btn-ghost btn-small" data-quality-reaction="meh" data-dare-id="${d.id}">Meh</button>
          <button class="btn btn-ghost btn-small" data-quality-reaction="good" data-dare-id="${d.id}">Good</button>
          <button class="btn btn-ghost btn-small" data-quality-reaction="loved_it" data-dare-id="${d.id}">Loved it</button>
        </div>`;
    }
    if (d.requires_confirmation && !d.signed_off_at) {
      pieces += `<button class="btn btn-gold btn-small" data-sign-off="${d.id}" style="margin-top:8px">Sign off as complete</button>`;
    } else if (d.requires_confirmation && d.signed_off_at) {
      pieces += `<div class="hint-text" style="margin-top:8px; color:var(--good)">✓ Signed off</div>`;
    }
    actions = pieces;
  }

  const totalPoints = d.points_awarded != null ? d.points_awarded + (d.quality_bonus_points || 0) : null;
  const evidenceCount = state.dareEvidence.filter(e => e.dare_id === d.id).length;
  const inPlay = ['accepted', 'in_progress', 'countered'].includes(d.status);
  const countdown = inPlay ? fmtCountdown(d.deadline) : null;

  return `
    <div class="dare ${d.status==='sent' && !isMine ? 'locked' : inPlay ? 'in-play' : 'unlocked'}">
      ${inPlay ? `<div class="in-play-banner"><span class="in-play-dot"></span>In play</div>` : ''}
      ${countdown ? `<div class="countdown-text ${countdown.overdue ? 'overdue' : ''}">${esc(countdown.text)}</div>` : ''}
      ${inPlay && state.partner && state.partner.signal_phone ? `<a class="link-btn" href="https://signal.me/#p/${encodeURIComponent(state.partner.signal_phone)}" target="_blank" rel="noopener" style="display:inline-block; margin-bottom:8px">Message on Signal →</a><br>` : ''}
      <div class="dare-top">
        <div class="dare-title">${stillBlindForSender ? '🙈 Blind dare' : esc(d.title)}</div>
        ${totalPoints != null ? `<div class="dare-points">${totalPoints} pts${d.quality_bonus_points ? ` <span class="hint-text">(+${d.quality_bonus_points} bonus)</span>` : ''}</div>` : ''}
      </div>
      <div class="dare-meta">
        <span class="pill intensity-${d.intensity}">${INTENSITY_LABELS[d.intensity]}</span>
        <span class="pill">${d.status.replace(/_/g,' ')}</span>
        ${d.deadline ? `<span class="pill">by ${fmtDate(d.deadline)}</span>` : ''}
      </div>
      ${compact ? '' : body}
      ${evidenceCount ? `<button class="link-btn" data-view-evidence="${d.id}">View evidence (${evidenceCount})</button>` : ''}
      ${actions}
    </div>
  `;
}

function renderDaresTab() {

  const doneByYou = state.dares.filter(d => d.recipient_id === state.session.user.id && d.status === 'completed');

function renderCollapsibleDareSection(title, dares, expandedKey, searchKey, searchInputId) {
